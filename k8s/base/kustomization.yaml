apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spooled

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  # Infrastructure components (can be excluded if using managed services)
  - pgbouncer.yaml
  - redis.yaml

labels:
  - pairs:
      app.kubernetes.io/name: spooled-backend
      app.kubernetes.io/part-of: spooled-cloud
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: "0.1.98"
    includeSelectors: false

images:
  - name: ghcr.io/spooled-cloud/spooled-backend
    newTag: latest
