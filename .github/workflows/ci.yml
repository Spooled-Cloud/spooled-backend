name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Production Compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: test-password
      JWT_SECRET: test-jwt-secret-at-least-32-characters
      CLOUDFLARE_TUNNEL_TOKEN: test-token
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Verify automatic gRPC TLS provisioning
        run: |
          # ONCE=1 makes the helper exit after writing certs (stack keeps it
          # running in normal deploys so Portainer does not show Exited (0)).
          GRPC_TLS_INIT_ONCE=1 docker compose -p spooled-compose-test -f docker-compose.prod.yml run --rm -e GRPC_TLS_INIT_ONCE=1 grpc-tls-init
          docker run --rm --user 1000:1000 --entrypoint /bin/sh \
            -v spooled-compose-test_grpc_tls:/tls:ro alpine/openssl:3.5.7 \
            -ec 'test -s /tls/grpc-cert.pem && test -r /tls/grpc-key.pem && openssl x509 -checkend 2592000 -noout -in /tls/grpc-cert.pem'

  # Fast formatting check - runs in parallel, fails fast
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check

  # Main test job with all checks
  test:
    name: Test
    runs-on: ubuntu-latest
    # Tests use testcontainers for Postgres/Redis, so we don't need service containers here.

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test (nextest)
        run: cargo nextest run --all-features --no-fail-fast

      - name: Clippy
        # Lint production code only (lib + bins). Tests are exercised by nextest,
        # and clippy on all targets is too noisy/slow for CI.
        run: cargo clippy --lib --bins -- -D warnings -A dead_code -A unused_imports

  # Security audit in parallel
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # jsonwebtoken's RustCrypto backend includes RSA, but this service only
      # signs and verifies HMAC JWTs, so the RSA private-key attack is unreachable.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  # Docker build after tests pass
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, fmt]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: spooled-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
