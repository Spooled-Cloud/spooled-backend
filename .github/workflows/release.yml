name: Build and Push Docker Images

on:
  # `:latest` is what production redeploys pull, so a main commit is published
  # only after CI passed on it (it used to be pushed on every main push, before
  # or even without a green CI run).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

# One publish at a time; a newer queued run replaces an older queued one, so
# `:latest` cannot be overwritten by an older commit finishing last. Manual
# runs on main share the group because they publish `:latest` too.
concurrency:
  group: release-${{ (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') && 'latest' || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Note: Docker registry requires lowercase names
  IMAGE_NAME: spooled-cloud/spooled-backend

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # `branches: [main]` above matches the triggering run's head BRANCH NAME, so
    # a pull request from a fork whose branch is also called `main` would match.
    # Only a successful CI run for a push to this repository may publish.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build exactly the commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify release tag matches version sources
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          manifest = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          matches = [
              package["version"]
              for package in lock["package"]
              if package["name"] == "spooled-backend"
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"expected one spooled-backend package in Cargo.lock, found {len(matches)}"
              )

          lock_version = matches[0]
          changelog = Path("CHANGELOG.md").read_text()
          heading = re.compile(rf"^## \[{re.escape(expected)}\] - \d{{4}}-\d{{2}}-\d{{2}}$")
          if not any(heading.fullmatch(line) for line in changelog.splitlines()):
              raise SystemExit(f"CHANGELOG.md has no dated release heading for {expected}")
          if expected != manifest or expected != lock_version:
              raise SystemExit(
                  "release version mismatch: "
                  f"tag={expected}, Cargo.toml={manifest}, Cargo.lock={lock_version}"
              )

          print(f"release version verified: {expected}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Never let metadata-action add `latest` on its own: with the default
          # `latest=auto` a semver tag push also tags each single-arch build as
          # `:latest`, overwriting the multi-arch manifest the main build made
          # (an arm64 host then pulled an amd64 image, 2026-10-11). `:latest` is
          # only ever the manifest from the create-manifest job on main.
          flavor: |
            latest=false
          # For workflow_run, github.sha is main's current head, which may be
          # newer than the commit CI tested and this job built.
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            # On main push: create latest-amd64 / latest-arm64
            type=raw,value=latest-${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
            # On tag push v0.1.1: create 0.1.1-amd64 / 0.1.1-arm64 only
            # (no floating major.minor — rebuilding an older tag must not clobber 0.1-*)
            type=semver,pattern={{version}}-${{ matrix.suffix }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.suffix }}
          provenance: false

  create-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64

      - name: Create and push manifest (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Strip 'v' prefix to match docker-metadata output (v0.1.1 -> 0.1.1)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Creating manifest for version: ${VERSION}"
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${VERSION} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: create-manifest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, create-manifest]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🚀 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| amd64 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| arm64 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.create-manifest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull the multi-arch image:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
