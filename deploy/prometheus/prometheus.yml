global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: spooled
    environment: production

scrape_configs:
  - job_name: spooled-backend
    static_configs:
      - targets: ["backend:9090"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
