      summary: Get organization usage
      description: |
        Returns current resource usage and plan limits for the authenticated organization.
        Includes daily job counts, resource counts, and warnings for approaching limits.
        `workers` counts healthy and degraded workers plus draining workers that sent a
        heartbeat in the last 2 minutes.
      operationId: getOrganizationUsage
      responses:
        '200':
          description: Usage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageInfo'

  /api/v1/organizations/billing-email/verification:
    post:
      tags: [Organizations]
      summary: Send a billing email confirmation code
      description: |
        Email login only resolves an organization by a **confirmed** billing
        email. Setting a `billing_email` through the API leaves it
        unconfirmed; changing a confirmed one stores the new address in
        `pending_billing_email` instead. This sends a 6-digit code to the
        pending address when there is one, otherwise to the unconfirmed
        `billing_email`. Shares the
        per-address hourly code budget with email login. Requires an
        unrestricted API key or session.
      operationId: startBillingEmailVerification
      responses:
        '200':
          description: Code sent, or the address was already confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingEmailVerificationResponse'
              example:
                status: code_sent
                email_sent_to: 'o***r@example.com'
        '400':
          description: The organization has no billing email
        '409':
          description: Another organization already confirmed this address
        '429':
          description: Too many codes sent to this address in the last hour

  /api/v1/organizations/billing-email/verify:
    post:
      tags: [Organizations]
      summary: Confirm the billing email
      description: |
        Confirms the billing email with the code sent by
        `POST /api/v1/organizations/billing-email/verification`. Confirming a
        pending address makes it the confirmed `billing_email` and clears
        `pending_billing_email`. A code is bound to the address it was sent to;
        changing the billing email again invalidates it. Five wrong attempts
        burn a code.
      operationId: verifyBillingEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: The address is confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingEmailVerificationResponse'
              example:
                status: verified
        '400':
          description: Invalid or expired code, or too many attempts
        '409':
          description: Another organization confirmed this address first

  /api/v1/organizations/webhook-token:
    get:
      tags: [Organizations]
      summary: Get webhook token
      description: |
        Get the current webhook token and URL for receiving incoming webhooks.
        The token is automatically generated when the organization is created.
      operationId: getWebhookToken
      responses:
        '200':
          description: Webhook token information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTokenResponse'
              example:
                webhook_token: 'whk_abc123...'
                webhook_url: 'https://api.spooled.cloud/api/v1/webhooks/org-id/custom'

