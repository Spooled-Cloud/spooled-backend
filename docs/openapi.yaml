  /api/v1/organizations/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID (must be the caller's own organization)
    get:
      tags: [Organizations]
      summary: List organization members
      description: |
        The organization's active API keys, oldest first, as members. An organization has no
        user accounts: each key is one member, `role` is `owner` for a key whose `queues`
        include `*` and `member` otherwise, and `email` is the organization's billing email.
        Requires an unrestricted key. Another organization's id answers `404`.
      operationId: listOrganizationMembers
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
