        payload:
          type: object
        status:
          type: string
          enum: [pending, success, failed]
        status_code:
          type: integer
          nullable: true
          description: HTTP status of the receiver's answer; null when no response arrived (it was 0)
        response_body:
          type: string
          nullable: true
          description: First 1024 bytes of the receiver's answer, for any status; null when empty or no response arrived
        error:
          type: string
          nullable: true
          description: >-
            Why the delivery failed (`HTTP 503`, a transport error such as a refused connection or
            timeout, or `Invalid webhook URL: ...`); null on success
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

