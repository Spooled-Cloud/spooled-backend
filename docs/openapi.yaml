openapi: 3.1.0
info:
  title: Spooled Cloud API
  description: |
    Production-ready webhook queue service API.

    Spooled Cloud provides a reliable, multi-tenant job queue system with:
    - Custom webhook ingestion (receive events from any source)
    - Job queue with retry logic and dead-letter queue
    - Worker coordination with heartbeat and lease management
    - Real-time job status updates via WebSocket/SSE
    - Workflow orchestration with job dependencies
    - Cron-based job scheduling
    - Stripe billing integration for subscription management

    ## Authentication

    All API endpoints (except health checks) require authentication via API key.
    Include your API key in the `Authorization` header:

    ```
    Authorization: Bearer sp_live_your_api_key_here
    ```

    ## Security

    - **Multi-tenant isolation**: All operations are scoped to your organization
    - **API key verification**: Keys verified using bcrypt with caching
    - **Webhook signatures**: HMAC-SHA256 with constant-time comparison
    - **Rate limiting**: Per-key limits with graceful degradation
    - **Input validation**: All inputs sanitized and size-limited
    - **SSRF protection**: Webhook URLs validated in production

    ## Rate Limiting

    Rate limits are applied per API key based on plan tier:
    - Free tier: 5 requests/second (burst: 10)
    - Starter tier: 25 requests/second (burst: 50)
    - Pro tier: 100 requests/second (burst: 200)
    - Enterprise: 500 requests/second (burst: 1000)

    Rate limit headers included in all responses:
    - `X-RateLimit-Limit`: Maximum requests per window
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when the window resets

    ## Plan Limits

    Each plan tier has resource limits:
    - Jobs per day: Free (1,000), Starter (10,000), Pro (100,000), Enterprise (unlimited)
    - Active jobs: Free (10), Starter (500), Pro (5,000), Enterprise (unlimited)
    - Queues: Free (2), Starter (10), Pro (50), Enterprise (unlimited)
    - Workers: Free (1), Starter (5), Pro (25), Enterprise (unlimited)
    - Workflows: Free (disabled), Starter (5), Pro (50), Enterprise (unlimited)

  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Spooled Cloud Support
    url: https://spooled.cloud/support
    email: support@spooled.cloud

servers:
  - url: https://api.spooled.cloud
    description: Production API
  - url: https://api.staging.spooled.cloud
    description: Staging API
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: JWT authentication and token management
  - name: Organizations
    description: Organization management
  - name: Jobs
    description: Job queue operations
  - name: Queues
    description: Queue configuration and statistics
  - name: Workers
    description: Worker registration and management
  - name: API Keys
    description: API key management
  - name: Webhooks
    description: Webhook ingestion endpoints
  - name: Workflows
    description: Workflow and job dependency management
  - name: Schedules
    description: Cron-based recurring job schedules
  - name: Outgoing Webhooks
    description: Configure webhooks for receiving notifications when events occur
  - name: Real-time
    description: WebSocket and Server-Sent Events for real-time updates
  - name: Billing
    description: Subscription and billing management via Stripe
  - name: Admin
    description: Platform administration (requires X-Admin-Key header)

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns the health status of the service and its dependencies
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                version: '1.0.0'
                database: true
                cache: true

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Kubernetes liveness probe - returns 200 if the service is running
      operationId: liveness
      security: []
      responses:
        '200':
          description: Service is alive

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Kubernetes readiness probe - returns 200 if the service can accept traffic
      operationId: readiness
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard data
      description: |
        Returns comprehensive dashboard data including system info, job statistics,
        queue summaries, worker status, and recent activity.

        Requires authentication. Data is scoped to the authenticated organization.
      operationId: dashboardData
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Returns application metrics in Prometheus text format.

        Metrics include:
        - `spooled_jobs_enqueued_total`: Total jobs enqueued
        - `spooled_jobs_completed_total`: Total jobs completed
        - `spooled_jobs_failed_total`: Total jobs failed
        - `spooled_jobs_pending`: Current pending jobs
        - `spooled_jobs_processing`: Current processing jobs
        - `spooled_job_duration_seconds`: Job processing duration histogram
        - `spooled_workers_active`: Active workers
        - `spooled_api_requests_total`: Total API requests
      operationId: prometheusMetrics
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP spooled_jobs_enqueued_total Total jobs enqueued
                # TYPE spooled_jobs_enqueued_total counter
                spooled_jobs_enqueued_total 1234
                # HELP spooled_jobs_pending Number of pending jobs
                # TYPE spooled_jobs_pending gauge
                spooled_jobs_pending 42

  # Authentication Endpoints
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login with API key
      description: Exchange an API key for JWT access and refresh tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      description: Invalidate the current access token
      operationId: logout
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Not authenticated

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user info
      description: Returns information about the authenticated user from the JWT token
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Not authenticated

  /api/v1/auth/validate:
    post:
      tags: [Authentication]
      summary: Validate a token
      description: Check if a JWT token is valid and not blacklisted
      operationId: validateToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
      responses:
        '200':
          description: Token validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'

  # Email-based Authentication
  /api/v1/auth/check-email:
    get:
      tags: [Authentication]
      summary: Check email availability
      description: Check if an email is already registered
      operationId: checkEmail
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: Email address to check
      responses:
        '200':
          description: Email check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckEmailResponse'

  /api/v1/auth/email/start:
    post:
      tags: [Authentication]
      summary: Start email login
      description: |
        Start the email-based login flow. Sends a verification code to the provided email.
        If the email is not associated with an existing organization, verification will
        return a short-lived signup token to complete registration.
      operationId: startEmailLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEmailLoginRequest'
      responses:
        '200':
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartEmailLoginResponse'
        '429':
          description: Too many requests - rate limited

  /api/v1/auth/email/verify:
    post:
      tags: [Authentication]
      summary: Verify email code
      description: Verify the code sent to the user's email and complete login
      operationId: verifyEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          description: Invalid or expired code
        '404':
          description: No pending verification found

  /api/v1/auth/signup/complete:
    post:
      tags: [Authentication]
      summary: Complete signup
      description: Complete the signup process by creating an organization
      operationId: completeSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignupRequest'
      responses:
        '201':
          description: Signup completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSignupResponse'
        '400':
          description: Invalid token or organization name

  # Billing Endpoints
  /api/v1/billing/status:
    get:
      tags: [Billing]
      summary: Get billing status
      description: Get the current billing status for the organization
      operationId: getBillingStatus
      responses:
        '200':
          description: Billing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'

  /api/v1/billing/portal:
    post:
      tags: [Billing]
      summary: Create portal session
      description: Create a Stripe Customer Portal session for managing subscriptions
      operationId: createBillingPortal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortalRequest'
      responses:
        '200':
          description: Portal session URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePortalResponse'

  /api/v1/billing/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook
      description: |
        Webhook endpoint for Stripe events. Secured with STRIPE_BILLING_WEBHOOK_SECRET.
        Handles subscription lifecycle events.
      operationId: stripeWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid webhook signature

  /api/v1/organizations/check-slug:
    get:
      tags: [Organizations]
      summary: Check slug availability
      description: Check if an organization slug is available
      operationId: checkSlug
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Slug to check
      responses:
        '200':
          description: Slug availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckSlugResponse'

  /api/v1/organizations/generate-slug:
    post:
      tags: [Organizations]
      summary: Generate unique slug
      description: Generate a unique slug from an organization name
      operationId: generateSlug
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSlugRequest'
      responses:
        '200':
          description: Generated slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSlugResponse'

  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      description: List all organizations accessible to the authenticated user
      operationId: listOrganizations
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSummary'
    post:
      tags: [Organizations]
      summary: Create organization
      description: Create a new organization
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '409':
          description: Organization with this slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID
    get:
      tags: [Organizations]
      summary: Get organization
      operationId: getOrganization
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Organization not found
    put:
      tags: [Organizations]
      summary: Update organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Organization not found
    delete:
      tags: [Organizations]
      summary: Delete organization
      operationId: deleteOrganization
      responses:
        '204':
          description: Organization deleted
        '404':
          description: Organization not found

  /api/v1/organizations/usage:
    get:
      tags: [Organizations]
      summary: Get organization usage
      description: |
        Returns current resource usage and plan limits for the authenticated organization.
        Includes daily job counts, resource counts, and warnings for approaching limits.
      operationId: getOrganizationUsage
      responses:
        '200':
          description: Usage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageInfo'

  /api/v1/organizations/webhook-token:
    get:
      tags: [Organizations]
      summary: Get webhook token
      description: |
        Get the current webhook token and URL for receiving incoming webhooks.
        The token is automatically generated when the organization is created.
      operationId: getWebhookToken
      responses:
        '200':
          description: Webhook token information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTokenResponse'
              example:
                webhook_token: 'whk_abc123...'
                webhook_url: 'https://api.spooled.cloud/api/v1/webhooks/org-id/custom'

  /api/v1/organizations/webhook-token/regenerate:
    post:
      tags: [Organizations]
      summary: Regenerate webhook token
      description: |
        Generate a new webhook token, invalidating the old one.
        Update your external services with the new token after regenerating.
      operationId: regenerateWebhookToken
      responses:
        '200':
          description: New webhook token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTokenResponse'

  /api/v1/organizations/webhook-token/clear:
    post:
      tags: [Organizations]
      summary: Clear webhook token (disabled)
      description: |
        This endpoint is **disabled**.

        Spooled Cloud no longer supports unauthenticated incoming webhook ingestion.
        Use `/api/v1/organizations/webhook-token/regenerate` to rotate the token instead.
      operationId: clearWebhookToken
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Must be true to confirm clearing the token
            example:
              confirm: true
      responses:
        '400':
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: validation_error
                message: Clearing the webhook token is not allowed. Use /organizations/webhook-token/regenerate to rotate it.

  # Admin Endpoints
  /api/v1/admin/organizations:
    get:
      tags: [Admin]
      summary: List all organizations
      description: |
        List all organizations on the platform. Requires admin authentication via X-Admin-Key header.
      operationId: adminListOrganizations
      security:
        - AdminKeyAuth: []
      parameters:
        - name: plan_tier
          in: query
          schema:
            type: string
            enum: [free, starter, pro, enterprise]
          description: Filter by plan tier
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or slug
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationList'
        '401':
          description: Invalid or missing admin key

    post:
      tags: [Admin]
      summary: Create organization (admin)
      description: Create a new organization with specified plan
      operationId: adminCreateOrganization
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreateOrganizationResponse'

  /api/v1/admin/organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID
    get:
      tags: [Admin]
      summary: Get organization details
      description: Get detailed information about an organization including usage statistics
      operationId: adminGetOrganization
      security:
        - AdminKeyAuth: []
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationDetail'
        '404':
          description: Organization not found
    patch:
      tags: [Admin]
      summary: Update organization
      description: Update organization settings including plan tier
      operationId: adminUpdateOrganization
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    delete:
      tags: [Admin]
      summary: Delete organization
      description: |
        Delete an organization and all its data.
        
        - **Soft delete** (default): Marks organization as deleted.
        - **Hard delete** (`hard_delete=true`): Permanently removes organization and all related data (jobs, workflows, workers, etc.).
      operationId: adminDeleteOrganization
      security:
        - AdminKeyAuth: []
      parameters:
        - name: hard_delete
          in: query
          schema:
            type: boolean
            default: false
          description: Permanent deletion (cannot be undone)
      responses:
        '204':
          description: Organization deleted
        '404':
          description: Organization not found

  /api/v1/admin/stats:
    get:
      tags: [Admin]
      summary: Get platform statistics
      description: Get platform-wide statistics
      operationId: adminGetStats
      security:
        - AdminKeyAuth: []
      responses:
        '200':
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'

  /api/v1/admin/plans:
    get:
      tags: [Admin]
      summary: List available plans
      description: Get all available plan tiers with their limits
      operationId: adminListPlans
      security:
        - AdminKeyAuth: []
      responses:
        '200':
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanLimits'

  /api/v1/admin/organizations/{id}/api-keys:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Admin]
      summary: Create API key for organization
      description: Create an API key for a specific organization
      operationId: adminCreateApiKey
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'

  /api/v1/admin/organizations/{id}/reset-usage:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Admin]
      summary: Reset organization usage
      description: Reset daily usage counters for an organization
      operationId: adminResetUsage
      security:
        - AdminKeyAuth: []
      responses:
        '200':
          description: Usage reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset:
                    type: boolean
                  organization_id:
                    type: string

  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: List jobs with optional filtering
      operationId: listJobs
      parameters:
        - name: queue_name
          in: query
          schema:
            type: string
          description: Filter by queue name
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, scheduled, processing, completed, failed, deadletter, cancelled]
          description: Filter by status
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 64
          description: Filter jobs by a single tag (matches Postgres `tags ? tag` semantics)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSummary'
    post:
      tags: [Jobs]
      summary: Create job
      description: |
        Create a new job in the specified queue.

        If an `idempotency_key` is provided and a job with the same key exists,
        the existing job ID is returned (idempotent behavior).
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '200':
          description: Existing job returned (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'

  /api/v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job ID
    get:
      tags: [Jobs]
      summary: Get job
      operationId: getJob
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
    delete:
      tags: [Jobs]
      summary: Cancel job
      description: Cancel a pending or scheduled job
      operationId: cancelJob
      responses:
        '204':
          description: Job cancelled
        '404':
          description: Job not found
        '409':
          description: Job cannot be cancelled (not in pending/scheduled state)

  /api/v1/jobs/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Retry job
      description: Retry a failed or dead-lettered job
      operationId: retryJob
      responses:
        '200':
          description: Job queued for retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: Job cannot be retried

  /api/v1/jobs/claim:
    post:
      tags: [Jobs]
      summary: Claim jobs for processing
      description: |
        Claim one or more jobs from a queue for processing.
        Jobs are leased to the worker for a configurable duration (default 5 minutes).
        If not completed before lease expiry, jobs are released for other workers.
      operationId: claimJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimJobsRequest'
      responses:
        '200':
          description: Jobs claimed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimJobsResponse'
        '404':
          description: Queue not found

  /api/v1/jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Complete job
      description: Mark a claimed job as successfully completed
      operationId: completeJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
      responses:
        '200':
          description: Job completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
        '409':
          description: Job not in processing state or lease expired

  /api/v1/jobs/{id}/fail:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Fail job
      description: |
        Mark a claimed job as failed. If retries remain, job will be rescheduled.
        If no retries remain, job moves to dead-letter queue.
      operationId: failJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailJobRequest'
      responses:
        '200':
          description: Job failed (will retry or go to DLQ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found

  /api/v1/jobs/{id}/heartbeat:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Renew job lease
      description: Extend the lease on a processing job to prevent it being reclaimed
      operationId: jobHeartbeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatJobRequest'
      responses:
        '200':
          description: Lease renewed
        '404':
          description: Job not found
        '409':
          description: Job not in processing state

  /api/v1/jobs/stats:
    get:
      tags: [Jobs]
      summary: Get job statistics
      operationId: getJobStats
      parameters:
        - name: queue_name
          in: query
          required: false
          description: Optional queue filter (alias `queue` also accepted)
          schema:
            type: string
          example: emails
      responses:
        '200':
          description: Job statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStats'

  /api/v1/jobs/status:
    get:
      tags: [Jobs]
      summary: Batch job status lookup
      description: |
        Get the status of multiple jobs in a single request.
        Maximum 100 job IDs per request.
      operationId: batchJobStatus
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated list of job IDs
          schema:
            type: string
          example: 'job-1,job-2,job-3'
      responses:
        '200':
          description: Job statuses retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchJobStatus'
        '400':
          description: Too many job IDs (max 100)

  /api/v1/jobs/bulk:
    post:
      tags: [Jobs]
      summary: Bulk enqueue jobs
      description: |
        Enqueue multiple jobs in a single request. 
        Maximum 100 jobs per request.
        Jobs are processed atomically where possible.
      operationId: bulkEnqueueJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEnqueueRequest'
            example:
              queue_name: emails
              default_priority: 0
              default_max_retries: 3
              jobs:
                - payload: { to: 'user@example.com', subject: 'Hello' }
                - payload: { to: 'user2@example.com', subject: 'Welcome' }
                  priority: 10
      responses:
        '200':
          description: Bulk enqueue results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEnqueueResponse'

  /api/v1/jobs/{id}/priority:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Jobs]
      summary: Boost job priority
      description: Update the priority of a pending or scheduled job
      operationId: boostJobPriority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoostPriorityRequest'
      responses:
        '200':
          description: Priority updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostPriorityResponse'
        '404':
          description: Job not found or not in pending/scheduled state

  /api/v1/jobs/dlq:
    get:
      tags: [Jobs]
      summary: List dead-letter queue
      description: List jobs in the dead-letter queue
      operationId: listDeadLetterQueue
      parameters:
        - name: queue_name
          in: query
          schema:
            type: string
          description: Filter by queue name
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 64
          description: Filter jobs by a single tag (matches Postgres `tags ? tag` semantics)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of dead-letter jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSummary'

  /api/v1/jobs/dlq/retry:
    post:
      tags: [Jobs]
      summary: Retry dead-letter jobs
      description: Move jobs from dead-letter queue back to pending
      operationId: retryDeadLetterJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryDlqRequest'
      responses:
        '200':
          description: Retry results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryDlqResponse'

  /api/v1/jobs/dlq/purge:
    post:
      tags: [Jobs]
      summary: Purge dead-letter queue
      description: Permanently delete jobs from dead-letter queue
      operationId: purgeDeadLetterQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeDlqRequest'
            example:
              queue_name: emails
              confirm: true
      responses:
        '200':
          description: Purge results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeDlqResponse'
        '400':
          description: Must confirm purge operation

  /api/v1/queues:
    get:
      tags: [Queues]
      summary: List queues
      operationId: listQueues
      responses:
        '200':
          description: List of queue configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueConfigSummary'

  /api/v1/queues/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Queue name
    get:
      tags: [Queues]
      summary: Get queue configuration
      operationId: getQueueConfig
      responses:
        '200':
          description: Queue configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueConfig'
        '404':
          description: Queue not found

    delete:
      tags: [Queues]
      summary: Delete queue
      description: |
        Delete a queue and optionally all its jobs.
        Use with caution - this operation is destructive.
      operationId: deleteQueue
      parameters:
        - name: delete_jobs
          in: query
          schema:
            type: boolean
            default: false
          description: Also delete all jobs in the queue
      responses:
        '204':
          description: Queue deleted
        '404':
          description: Queue not found

  /api/v1/queues/{name}/config:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Queues]
      summary: Update queue configuration
      operationId: updateQueueConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertQueueConfigRequest'
      responses:
        '200':
          description: Queue configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueConfig'

  /api/v1/queues/{name}/stats:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Queues]
      summary: Get queue statistics
      operationId: getQueueStats
      responses:
        '200':
          description: Queue statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStats'

  /api/v1/queues/{name}/pause:
    parameters:
      - name: name
        in: path
