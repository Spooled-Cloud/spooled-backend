    AdminUpdateOrganizationRequest:
      type: object
      description: |
        Update organization settings. All fields are optional.
        
        When setting `stripe_subscription_id`, the backend will auto-reconcile with Stripe API
        to fetch the correct plan tier, subscription status, and billing period from Stripe.
      properties:
        name:
          type: string
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
        is_active:
          type: boolean
        billing_email:
          type: string
          format: email
          description: >-
            An operator write counts as confirmed (even re-sending the current address) and
            clears a change the organization still had pending.
        settings:
          type: object
        custom_limits:
          type: object
          nullable: true
          description: |
            Per-organization limit overrides (null or an empty object resets to plan defaults).
            Optional keys, each a whole number:

            - Resource caps `max_jobs_per_day`, `max_active_jobs`, `max_queues`, `max_workers`,
              `max_api_keys`, `max_schedules`, `max_workflows`, `max_webhooks`: `null` or `-1`
              means unlimited.
            - Settings `max_payload_size_bytes`, `rate_limit_requests_per_second`,
              `rate_limit_burst`, `job_retention_days`, `history_retention_days`: `null` keeps the
              plan default; the two retention keys must be 0-36500 days. `0` for
              `rate_limit_requests_per_second` or `rate_limit_burst` blocks the organization: every
              authenticated request answers `429` (`Retry-After: 60`; gRPC `RESOURCE_EXHAUSTED`).
              Before 0.1.126 it was enforced as one request per second.

            Unknown keys, non-integers and any other negative or out-of-range value are a
            `400 VALIDATION_ERROR`.
          properties:
            max_jobs_per_day: {type: integer, nullable: true, minimum: -1}
            max_active_jobs: {type: integer, nullable: true, minimum: -1}
            max_queues: {type: integer, nullable: true, minimum: -1}
            max_workers: {type: integer, nullable: true, minimum: -1}
            max_api_keys: {type: integer, nullable: true, minimum: -1}
            max_schedules: {type: integer, nullable: true, minimum: -1}
            max_workflows: {type: integer, nullable: true, minimum: -1}
            max_webhooks: {type: integer, nullable: true, minimum: -1}
            max_payload_size_bytes: {type: integer, nullable: true, minimum: 0}
            rate_limit_requests_per_second: {type: integer, nullable: true, minimum: 0}
            rate_limit_burst: {type: integer, nullable: true, minimum: 0}
            job_retention_days: {type: integer, nullable: true, minimum: 0, maximum: 36500}
            history_retention_days: {type: integer, nullable: true, minimum: 0, maximum: 36500}
          additionalProperties: false
        stripe_customer_id:
          type: string
          nullable: true
          description: Link a Stripe customer to this organization
          example: cus_TcO2bC8PunEANY
        stripe_subscription_id:
          type: string
          nullable: true
          description: Link a Stripe subscription (triggers auto-reconciliation with Stripe)
          example: sub_1Sf9GgDtp6Ou1g6CEOL29LqS
        stripe_subscription_status:
          type: string
          nullable: true
          description: Subscription status (usually auto-filled by reconciliation)
          enum: [active, past_due, canceled, unpaid, incomplete, trialing]

