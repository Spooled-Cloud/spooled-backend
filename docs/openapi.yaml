    # Outgoing Webhook Schemas
    OutgoingWebhook:
      type: object
      required:
        [id, organization_id, name, url, events, format, enabled, failure_count, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          description: >-
            Subscribed events; see CreateOutgoingWebhookRequest.events for the newer ones
            (`workflow.completed` and `workflow.failed` are announced at most once).
          items:
            type: string
            enum:
              - job.created
              - job.started
              - job.completed
              - job.failed
              - job.cancelled
              - job.deadlettered
              - job.retried
              - workflow.completed
              - workflow.failed
              - queue.paused
              - queue.resumed
              - worker.registered
              - worker.deregistered
              - schedule.triggered
        format:
          type: string
          enum: [json, slack, discord, teams]
          default: json
          description: >-
            Body format of the delivery, rendered when it is sent. `json` is the signed event
            envelope; `slack`, `discord` and `teams` send a chat message for that service.
            `X-Spooled-Signature` always covers the bytes actually sent.
        enabled:
          type: boolean
          description: >-
            Set to false automatically after 20 consecutive failed deliveries,
            together with last_status = auto_disabled. Re-enable with
            PUT /api/v1/outgoing-webhooks/{id} and {"enabled": true}; that is
            charged against the plan webhook cap and can return
            429 QUOTA_EXCEEDED.
        failure_count:
          type: integer
          description: >-
            Consecutive failed deliveries. Incremented once per delivery, not
            once per retry attempt, and reset to 0 by any successful delivery
            including a successful manual retry.
        last_triggered_at:
          type: string
          format: date-time
        last_status:
          type: string
          enum: [success, failed, auto_disabled]
          description: >-
            Outcome of the most recent delivery. auto_disabled means the
            consecutive-failure threshold was reached and the webhook was
            disabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOutgoingWebhookRequest:
      type: object
      required: [name, url, events]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          description: |
            Events to deliver; each delivery names its event in `event` and `X-Spooled-Event`.
            The events added in 0.1.122:

            - `job.deadlettered`: sent next to every `job.failed` whose `data.status` is
              `deadletter`, with the same `data`.
            - `job.retried`: a `failed`, `deadletter` or `cancelled` job put back to `pending` by
              `POST /api/v1/jobs/{id}/retry`, `POST /api/v1/jobs/dlq/retry` or
              `POST /api/v1/workflows/{id}/retry` (`data.old_status`, `data.source`).
            - `workflow.completed` / `workflow.failed`: a workflow finished with no / at least
              one failed or dead-lettered job (a cancelled workflow sends neither). Announced
              **at most once** per outcome: a scheduler pass every 10 s marks the outcome
              announced and commits, then queues the event in memory. So no outcome is sent
              twice, but one is lost if the process stops between that commit and the delivery
              being recorded, if the delivery queue is full at that moment, or if recording the
              delivery fails; a failed workflow retried with `POST /api/v1/workflows/{id}/retry`
              before the next pass (within about 10 s) never announces that `workflow.failed`,
              only the outcome it reaches after the retry; an outcome more than an hour old at
              the pass is never sent. Confirm with `GET /api/v1/workflows/{id}`.

            `data` of the new events: `job.deadlettered` has `job_id`, `queue_name`, `status`
            (`deadletter`) and `error`; `job.retried` has `job_id`, `queue_name`, `status`
            (`pending`), `old_status` (`failed`, `deadletter` or `cancelled`), `source`
            (`job_retry`, `dlq_retry` or `workflow_retry`) and, for a workflow job, `workflow_id`;
            `workflow.completed` / `workflow.failed` have `workflow_id`, `name`, `status`,
            `total_jobs`, `completed_jobs`, `failed_jobs`, `created_at`, `started_at` (nullable),
            `completed_at` and `metadata` (nullable).
          items:
            type: string
            enum:
              - job.created
              - job.started
              - job.completed
              - job.failed
              - job.cancelled
              - job.deadlettered
              - job.retried
              - workflow.completed
              - workflow.failed
              - queue.paused
              - queue.resumed
              - worker.registered
              - worker.deregistered
              - schedule.triggered
        secret:
          type: string
          maxLength: 255
          description: Optional HMAC secret for signing webhook payloads
        format:
          type: string
          enum: [json, slack, discord, teams]
          default: json
          description: >-
            Body format of the delivery, rendered when it is sent. `json` is the signed event
            envelope; `slack`, `discord` and `teams` send a chat message for that service.
            `X-Spooled-Signature` always covers the bytes actually sent.
        enabled:
          type: boolean
          default: true

    UpdateOutgoingWebhookRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          description: >-
            Replaces the subscribed events; the values of CreateOutgoingWebhookRequest.events
            (`workflow.completed` and `workflow.failed` are announced at most once).
          items:
            type: string
        secret:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Three-state. Omit the field to keep the current secret, send null to
            CLEAR it (deliveries then go out unsigned, with no
            X-Spooled-Signature header), or send a string to replace it.
            Note: clients that serialise unchanged fields as explicit null will
            clear the secret.
        format:
          type: string
          enum: [json, slack, discord, teams]
          description: >-
            Body format of the delivery, rendered when it is sent. `json` is the signed event
            envelope; `slack`, `discord` and `teams` send a chat message for that service.
            `X-Spooled-Signature` always covers the bytes actually sent.
        enabled:
          type: boolean
          description: >-
            Set true to re-enable a webhook, including one that was
            auto-disabled after 20 consecutive failed deliveries. Re-enabling is
            charged against the plan webhook cap and can return
            429 QUOTA_EXCEEDED.

    TestWebhookResponse:
      type: object
      required: [success, response_time_ms]
      properties:
        success:
          type: boolean
        status_code:
          type: integer
        response_time_ms:
          type: integer
        error:
          type: string

    OutgoingWebhookDelivery:
      type: object
      required: [id, webhook_id, event, payload, status, attempts, created_at]
      properties:
        id:
          type: string
        webhook_id:
          type: string
        event:
