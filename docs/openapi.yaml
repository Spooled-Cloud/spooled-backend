  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: |
        List jobs with optional filtering and ordering.

        Filters are strict: an invalid `status`, `queue_name`, `tag`, `order_by` or `order_dir`
        is a `400 VALIDATION_ERROR`. Before 0.1.121 it was ignored and the unfiltered list came
        back with `200`. An empty parameter (`?status=`) is no filter.

        Jobs are ordered by `order_by` / `order_dir` and then by job id in the same direction,
        so rows that tie on the column (a bulk batch shares one `created_at`) keep one order
        across `offset` pages. `scheduled_at` and `completed_at` sort `NULLS LAST`. Pagination
        is by `limit` and `offset` only; there is no cursor. The `X-Has-More` response header
        (`true` or `false`) says whether another page follows.

        `status` may be a comma-separated list (`status=failed,deadletter`). `q` searches id
        prefixes, queue names and job types; `job_type`, `created_after` and `created_before`
        filter on the job type and the creation time. An invalid value is a 400.

        The list runs under a statement timeout (5 s by default, `DATABASE_LIST_STATEMENT_TIMEOUT_MS`).
        A list the database cannot answer in time is stopped and answered
        `400 QUERY_TIMEOUT`; the same request would time out again, so narrow it (`queue_name`,
        `status`, `job_type`, a created window, a longer `q`) rather than retrying it.
      operationId: listJobs
      parameters:
        - name: queue_name
          in: query
          schema:
            type: string
            maxLength: 255
          description: >-
            Filter by queue name (the alias `queue` is also accepted). Letters, digits, `-`,
            `_` and `.` only; anything else is a 400.
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, scheduled, processing, completed, failed, deadletter, cancelled]
          description: >-
            Filter by status. Matched case-insensitively (`Pending` = `pending`). Several
            statuses may be given comma-separated (`failed,deadletter`).
        - name: q
          in: query
          schema:
            type: string
            maxLength: 255
          description: >-
            Search text, case-insensitive, at most 255 bytes: matches a job whose id starts with
            it, or whose `queue_name` or `payload.job_type` contains it. `%` and `_` match
            themselves. The job type part compares the text with the organization's distinct job
            types, not with each job: the first 1000 distinct job types in sort order, each of at
            most 255 bytes. A job whose type is beyond that is still found by `job_type` (exact),
            by its id or by its queue.
        - name: job_type
          in: query
          schema:
            type: string
            maxLength: 255
          description: Exact `payload.job_type`, at most 255 bytes (a longer job type never matches).
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
          description: RFC 3339 instant; only jobs created at or after it.
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
          description: RFC 3339 instant; only jobs created before it.
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 1024
          description: >-
            Filter jobs by a single tag (matches Postgres `tags ? tag` semantics). Any
            characters (`customer:42`), at most 1024 bytes and no NUL character.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Offset for pagination
        - name: order_by
          in: query
          schema:
            type: string
            enum:
              [created_at, updated_at, scheduled_at, completed_at, priority, status, queue_name, retry_count]
            default: created_at
          description: Column to sort by (case-insensitive). Any other value is a 400.
        - name: order_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction (case-insensitive). Any other value is a 400.
      responses:
        '200':
          description: List of jobs
          headers:
            X-Has-More:
              description: '`true` when another page follows, else `false`'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSummary'
        '400':
          description: >-
            Invalid `status`, `queue_name`, `tag`, `q`, `job_type`, `created_after`,
            `created_before`, `order_by` or `order_dir` (`VALIDATION_ERROR`), or the list hit its
            statement timeout (`QUERY_TIMEOUT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Jobs]
      summary: Create job
      description: |
        Create a new job in the specified queue.

        If an `idempotency_key` is provided and a job with the same key exists,
        the existing job ID is returned (idempotent behavior, `200` with `created: false`).
        The replay is answered before the payload, quota and expiry checks and consumes no
        quota, so retrying a request whose response was lost never fails with `429` because the
        organization is at a limit. A key lives as long as its job row: there is no time-to-live,
        and a finished job (cancelled and dead-lettered ones included) keeps answering for its key
        until the plan's job retention removes it. An empty or
        whitespace-only `idempotency_key` is treated as no key. A key whose
        existing job is outside this API key's queue scope is `409 CONFLICT`
        (`Idempotency key is already in use`) and does not return that job id.
        The same answer is `FAILED_PRECONDITION` on gRPC Enqueue. A key that can
        see the stored queue still gets `200` with `created: false`.

        `expires_at` must be in the future and later than `scheduled_at`, otherwise the request
        is a `400`. A payload or tags containing the NUL character (`\u0000`) is also a `400`.
        At the daily job limit the job is refused before it is created.

        `completion_webhook` is POSTed once when the job completes, fails, or is dead-lettered.
        The body that is signed (HMAC of `{timestamp}.{rawBody}` when `completion_webhook_secret`
        is set) is `{id, event, created_at, data}`. `data` is `{job_id, queue_name, status, result}`
        on success and `{job_id, queue_name, status, error}` on failure (`event` is then
        `job.failed`; `data.status` may be `deadletter`). There is no `data.completed_at`.
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '200':
          description: Existing job returned (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '400':
          description: >-
            Invalid request: `expires_at` not in the future or not later than `scheduled_at`, a
            payload or tags containing the NUL character, or a value the database refuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job ID
    get:
      tags: [Jobs]
      summary: Get job
      operationId: getJob
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
    delete:
      tags: [Jobs]
      summary: Cancel job
      description: Cancel a pending or scheduled job
      operationId: cancelJob
      responses:
        '204':
          description: Job cancelled
        '404':
          description: Job not found
        '409':
          description: Job cannot be cancelled (not in pending/scheduled state)

  /api/v1/jobs/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Retry job
      description: |
        Retry a failed or dead-lettered job. The retry resets the job (fresh retry budget) and
        removes its dead-letter entry. In the same transaction it re-opens the dependents the
        scheduler cancelled because of this job ("Dependency job failed or was deadlettered",
        "Parent job failed or was deadlettered"), which wait again until the job completes, and
        puts the job's `failed` workflow back to `running`. A job someone cancelled stays
        cancelled.

        A dead-lettered step of a `cancelled` workflow cannot be retried: cancelling the workflow
        cancelled only its pending and scheduled steps, and retrying the rest would run the payload
        of a workflow that stays `cancelled`. That call is a `409`.

        Putting a failed workflow back to `running` takes one of the plan's `max_workflows`
        slots (only pending and running workflows count), like `POST /workflows/{id}/retry`: the
        call is refused with `429 QUOTA_EXCEEDED` (resource `workflows`) when the organization is
        at its limit, and with `403` (`feature_disabled`) on a plan without workflows.
      operationId: retryJob
      responses:
        '200':
          description: Job queued for retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          description: >-
            `feature_disabled`: the job belongs to a failed workflow and the plan has no
            workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Job cannot be retried: it is not failed or dead-lettered, or it belongs to a cancelled
            workflow ("Job belongs to a cancelled workflow and cannot be retried")
        '429':
          description: >-
            `QUOTA_EXCEEDED` (resource `workflows`): the job belongs to a failed workflow and
            reviving it would exceed the plan's limit of pending and running workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/claim:
    post:
      tags: [Jobs]
      summary: Claim jobs for processing
      description: |
        Claim one or more jobs from a queue for processing.
        Jobs are leased to the worker for `lease_duration_secs` (default 30 s,
        `WORKER_LEASE_DURATION_SECS`). The granted length is remembered: a heartbeat that omits
        `lease_duration_secs` renews for it. If not completed before lease expiry, jobs are
        released for other workers.
      operationId: claimJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimJobsRequest'
      responses:
        '200':
          description: Jobs claimed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimJobsResponse'
        '404':
          description: Queue not found

  /api/v1/jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Complete job
      description: Mark a claimed job as successfully completed
      operationId: completeJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
      responses:
        '200':
          description: Job completed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '404':
          description: Job not found
        '409':
          description: Job not in processing state or lease expired
        '422':
          description: >-
            `VALIDATION_ERROR`: `worker_id` or `lease_id` is missing (a missing `lease_id` used to
            be a `409 LEASE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/fail:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Fail job
      description: |
        Mark a claimed job as failed. If retries remain, the job is rescheduled: its status is
        `scheduled` until the backoff elapses (`scheduled_at`), then it is claimable again
        (before 0.1.126 it read `pending` meanwhile). If no retries remain, job moves to
        dead-letter queue.
      operationId: failJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailJobRequest'
      responses:
        '200':
          description: Job failed (will retry or go to DLQ)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '404':
          description: Job not found
        '422':
          description: >-
            `VALIDATION_ERROR`: `worker_id`, `error` or `lease_id` is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/heartbeat:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Renew job lease
      description: |
        Extend the lease on a processing job to prevent it being reclaimed.

        Without `lease_duration_secs` the lease is renewed for the length it was granted with
        (the claim's `lease_duration_secs`, or the last heartbeat that named one); only a job
        with no recorded length falls back to the server default (30 s). It used to renew for
        30 s, which cut a longer lease short. `lease_id` is required (`422` when missing).
      operationId: jobHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatJobRequest'
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '404':
          description: Job not found
        '409':
          description: Job not in processing state
        '422':
          description: >-
            `VALIDATION_ERROR`: `worker_id` or `lease_id` is missing, or `lease_duration_secs` is
            outside 5-3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Jobs]
      summary: Job history
      description: |
        The lifecycle events recorded for a job (`job_history`). A job of another organization,
        or in a queue outside the key's scope, answers `404`. The `X-Has-More` response header
        says whether more events follow.
      operationId: getJobHistory
      parameters:
        - name: order_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Oldest event first (`asc`, default) or newest first (`desc`). Alias `order`.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Events per page
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
          description: Events to skip
      responses:
        '200':
          description: Job events
          headers:
            X-Has-More:
              description: '`true` when more events follow, else `false`'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobHistoryEvent'
        '401':
          description: Missing or invalid API key
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/stats:
    get:
      tags: [Jobs]
      summary: Get job statistics
      operationId: getJobStats
      parameters:
        - name: queue_name
          in: query
          required: false
          description: >-
            Optional queue filter (alias `queue` also accepted). An invalid name (letters,
            digits, `-`, `_` and `.` only) is a 400; it used to return the organization totals.
          schema:
            type: string
          example: emails
      responses:
        '200':
          description: Job statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStats'
        '400':
          description: Invalid `queue_name`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/status:
    get:
      tags: [Jobs]
      summary: Batch job status lookup
      description: |
        Get the status of multiple jobs in a single request.
        Maximum 100 job IDs per request.
      operationId: batchJobStatus
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated list of job IDs
          schema:
            type: string
          example: 'job-1,job-2,job-3'
      responses:
        '200':
          description: Job statuses retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchJobStatus'
        '400':
          description: Too many job IDs (max 100)

  /api/v1/jobs/bulk:
    post:
      tags: [Jobs]
      summary: Bulk enqueue jobs
      description: |
        Enqueue multiple jobs in a single request.
        Maximum 100 jobs per request.

        Items are validated one by one. An invalid item (payload over the plan limit or
        containing the NUL character, `priority` outside -100..100, `idempotency_key` over 255
        characters) is listed in `failed` with its `index` and the reason, and the valid items
        are still created. The batch defaults are range-checked too (`default_priority`
        -100..100, `default_max_retries` 0..100, `default_timeout_seconds` 1..86400).

        The request is a `400` instead of a `200` with every item failed when no item is valid
        (the message lists `jobs[i]: reason` for each), a batch default is out of range, or the
        database refuses a value; any other database failure is a `500`.

        An empty or whitespace-only `idempotency_key` is no key. Items whose key already exists
        come back with `created: false` and charge no quota; only the jobs a batch creates count
        against the payload, active-job, daily and new-queue limits. If any of those keys belongs
        to a job outside this API key's queue scope, the whole request is `409 CONFLICT`
        (`Idempotency key is already in use`): no item is created and that job id is not returned.

        The request body may be up to 100 jobs at the largest plan payload cap (plus 4 KiB
        per job for the envelope), capped at 32 MiB, which is the current limit. A larger
        body is refused (`413 PAYLOAD_TOO_LARGE`, or `400 INVALID_JSON` when the body
        reader reports the length limit); split the batch. Every other endpoint accepts
        bodies up to 2 MiB. Each job's payload is still checked against the plan's payload
        limit.
      operationId: bulkEnqueueJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEnqueueRequest'
            example:
              queue_name: emails
              default_priority: 0
              default_max_retries: 3
              jobs:
                - payload: { to: 'user@example.com', subject: 'Hello' }
                - payload: { to: 'user2@example.com', subject: 'Welcome' }
                  priority: 10
      responses:
        '200':
          description: Bulk enqueue results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEnqueueResponse'
        '400':
          description: >-
            No valid item in the batch, an out-of-range batch default, or a value the database
            refuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body is over the bulk limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/priority:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Jobs]
      summary: Boost job priority
      description: Update the priority of a pending or scheduled job
      operationId: boostJobPriority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoostPriorityRequest'
      responses:
        '200':
          description: Priority updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoostPriorityResponse'
        '404':
          description: Job not found or not in pending/scheduled state

  /api/v1/jobs/dlq:
    get:
      tags: [Jobs]
      summary: List dead-letter queue
      description: |
        List jobs in the dead-letter queue. Filters, ordering, the `X-Has-More` header and the
        statement timeout follow `GET /jobs`: an invalid `queue_name`, `tag`, `q`, `job_type`,
        `created_after`, `created_before`, `order_by` or `order_dir` is a `400`, ties are broken
        by job id, and a list stopped by the timeout is a `400 QUERY_TIMEOUT`. `status` is ignored.
      operationId: listDeadLetterQueue
      parameters:
        - name: queue_name
          in: query
          schema:
            type: string
            maxLength: 255
          description: Filter by queue name (letters, digits, `-`, `_` and `.` only)
        - name: q
          in: query
          schema:
            type: string
            maxLength: 255
          description: >-
            Search text, as `q` of `GET /jobs` (case-insensitive, at most 255 bytes; its job-type
            part looks at the organization's first 1000 distinct job types).
        - name: job_type
          in: query
          schema:
            type: string
            maxLength: 255
          description: Exact `payload.job_type`, as `job_type` of `GET /jobs`.
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
          description: RFC 3339 instant; only jobs created at or after it.
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
          description: RFC 3339 instant; only jobs created before it.
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 1024
          description: >-
            Filter jobs by a single tag (matches Postgres `tags ? tag` semantics). Any
            characters, at most 1024 bytes and no NUL character.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: order_by
          in: query
          schema:
            type: string
            enum:
              [created_at, updated_at, scheduled_at, completed_at, priority, status, queue_name, retry_count]
            default: created_at
        - name: order_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of dead-letter jobs
          headers:
            X-Has-More:
              description: '`true` when another page follows, else `false`'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSummary'
        '400':
          description: >-
            Invalid `queue_name`, `tag`, `q`, `job_type`, `created_after`, `created_before`,
            `order_by` or `order_dir` (`VALIDATION_ERROR`), or the list hit its statement timeout
            (`QUERY_TIMEOUT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/dlq/retry:
    post:
      tags: [Jobs]
      summary: Retry dead-letter jobs
      description: |
        Move jobs from dead-letter queue back to pending, oldest first. Only the plan's
        active-jobs limit applies; the daily job limit does not, because a retry creates no new
        job. Each retried job resets its retry budget, removes its dead-letter entry and, as
        `POST /jobs/{id}/retry` does, re-opens the dependents the scheduler cancelled because of
        it and puts its `failed` workflow back to `running`.

        Reviving a failed workflow takes one `max_workflows` slot. This call retries the
        dead-lettered steps of as many failed workflows as fit under the limit (the workflow with
        the oldest step first) and leaves the other steps in the dead-letter queue, listed in
        `skipped_jobs`. Only when nothing else could be retried does it fail with the limit's
        error (`429`, or `403` on a plan without workflows).

        A dead-lettered step of a `cancelled` workflow is skipped, whether the call selects jobs by
        `job_ids`, by `queue_name` or neither: it stays in the dead-letter queue and is not counted
        (`POST /jobs/{id}/retry` answers `409` for it).
      operationId: retryDeadLetterJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryDlqRequest'
      responses:
        '200':
          description: Retry results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryDlqResponse'
        '403':
          description: >-
            `feature_disabled`: nothing could be retried because every selected job is a step of
            a failed workflow and the plan has no workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            `QUOTA_EXCEEDED`: the active-jobs limit would be exceeded (resource `active_jobs`), or
            nothing could be retried because every selected job is a step of a failed workflow
            that does not fit under `max_workflows` (resource `workflows`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/dlq/purge:
    post:
      tags: [Jobs]
      summary: Purge dead-letter queue
      description: |
        Permanently delete jobs from dead-letter queue. `older_than` selects jobs dead-lettered
        before that time (not jobs created before it).
      operationId: purgeDeadLetterQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeDlqRequest'
            example:
              queue_name: emails
              confirm: true
      responses:
        '200':
          description: Purge results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeDlqResponse'
        '400':
          description: Must confirm purge operation

  /api/v1/queues:
    get:
      tags: [Queues]
      summary: List queues
      operationId: listQueues
      responses:
        '200':
          description: List of queue configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueConfigSummary'

  /api/v1/queues/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Queue name
    get:
      tags: [Queues]
      summary: Get queue configuration
      operationId: getQueueConfig
      responses:
        '200':
          description: Queue configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueConfig'
        '404':
          description: Queue not found

    delete:
      tags: [Queues]
      summary: Delete queue
      description: |
        Delete a queue and optionally all its jobs.
        Use with caution - this operation is destructive.
      operationId: deleteQueue
      parameters:
        - name: delete_jobs
          in: query
          schema:
            type: boolean
            default: false
          description: Also delete all jobs in the queue
      responses:
        '204':
          description: Queue deleted
        '404':
          description: Queue not found
        '409':
          description: Queue has pending or processing jobs (only when delete_jobs is false)

  /api/v1/queues/{name}/config:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Queues]
      summary: Update queue configuration
      description: |
        Creates or updates the configuration of a queue. The body is validated (`max_retries`
        0-100, `default_timeout` 1-86400, `rate_limit` 1-100000) and so is the `{name}` in the
        path: 1-100 letters, digits, `-`, `_` or `.`, not starting with `.` or `-`, the rules a
        job's `queue_name` follows. Values outside the ranges are a `400`; they used to be stored
        (a `default_timeout` of two days then made every enqueue to the queue fail) or, for
        `rate_limit`, clamped silently. Omitted fields keep their stored value.
      operationId: updateQueueConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertQueueConfigRequest'
      responses:
        '200':
          description: Queue configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueConfig'
        '400':
          description: A field outside its range, or an invalid queue name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/queues/{name}/stats:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Queues]
      summary: Get queue statistics
      description: |
        `failed_jobs_24h` counts jobs dead-lettered in the last 24 hours and `deadletter_jobs`
        is the queue's current dead-letter count. `failed_jobs_24h` was always 0 before 0.1.121.
      operationId: getQueueStats
      responses:
        '200':
          description: Queue statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStats'

  /api/v1/queues/{name}/pause:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Queues]
      summary: Pause queue
      description: |
        Pause job processing for this queue.
        New jobs can still be enqueued but won't be processed until resumed.
      operationId: pauseQueue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseQueueRequest'
      responses:
        '200':
          description: Queue paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseQueueResponse'

  /api/v1/queues/{name}/resume:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Queues]
      summary: Resume queue
      description: Resume job processing for a paused queue
      operationId: resumeQueue
      responses:
        '200':
          description: Queue resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeQueueResponse'
        '404':
          description: Queue not found

  /api/v1/workers:
    get:
      tags: [Workers]
      summary: List workers
      operationId: listWorkers
      responses:
        '200':
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerSummary'

  /api/v1/workers/register:
    post:
      tags: [Workers]
      summary: Register worker
      description: |
        Registers a worker, or updates it when `worker_id` names a worker this organization
        already holds. The plan's `max_workers` limit counts healthy and degraded workers
        plus draining workers that sent a heartbeat in the last 2 minutes; re-registering a
        counted id does not take a second slot.

        `queue_name` follows the claim rules: 1-100 characters of letters, digits, `-`, `_` and
        `.`, not starting with `.` or `-` (`400 VALIDATION_ERROR` otherwise). A worker registered
        for any other name could never be given a job. gRPC `RegisterWorker` applies the same
        rule (`INVALID_ARGUMENT`).
      operationId: registerWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWorkerRequest'
      responses:
        '201':
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterWorkerResponse'
        '409':
          description: >-
            "This worker_id cannot be used: register with a different worker_id, or omit it to get
            a generated one". The `worker_id` belongs to another organization, or, for a
            queue-scoped key, to a worker of this organization that serves a queue outside the
            key's scope. Both cases answer the same text, so it does not say which one it was.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The plan's worker limit is reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/workers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Workers]
      summary: Get worker
      operationId: getWorker
      responses:
        '200':
          description: Worker details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '404':
          description: Worker not found

  /api/v1/workers/{id}/heartbeat:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Workers]
      summary: Send heartbeat
      operationId: workerHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeatRequest'
      responses:
        '200':
          description: Heartbeat received
        '404':
          description: Worker not found

  /api/v1/workers/{id}/deregister:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Workers]
      summary: Deregister worker
      description: |
        Marks the worker `offline` and releases its jobs whose lease has already expired (each
        counts as a retry and records a `retry_scheduled` history event). A job whose lease is
        still live stays `processing` with the worker, which may be inside its handler: it is
        completed by that worker or recovered when the lease expires (since 0.1.126; before, it
        was requeued at once and could run twice).
      operationId: deregisterWorker
      responses:
        '204':
          description: Worker deregistered
        '404':
          description: Worker not found

  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      description: |
        API keys for the caller's organization, newest first
        (`created_at` descending, then `id` descending). The body is a bare array.
        `limit` is clamped to 1-100 (default 100) and `offset` to at least 0.
      operationId: listApiKeys
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Page size. Values outside 1-100 are clamped.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Keys to skip. Negative values are treated as 0.
      responses:
        '200':
          description: List of API keys (without secret values)
          headers:
            X-Has-More:
              description: '`true` when another page follows, else `false`'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeySummary'
    post:
      tags: [API Keys]
      summary: Create API key
      description: |
        Create a new API key. The raw key value is only returned once in the response.
        Store it securely - it cannot be retrieved later.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          description: >-
            `VALIDATION_ERROR`: an invalid `queues` entry (for example `orders*`, `*.eu`;
            `invalid_queue_pattern`), `permissions` sent, or another invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [API Keys]
      summary: Get API key
      operationId: getApiKey
      responses:
        '200':
          description: API key details (without secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySummary'
        '404':
          description: API key not found
    put:
      tags: [API Keys]
      summary: Update API key
      operationId: updateApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyRequest'
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySummary'
        '400':
          description: >-
            `VALIDATION_ERROR`: an invalid `queues` entry (`invalid_queue_pattern`), `permissions`
            sent, or another invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key not found
        '429':
          description: >-
            `QUOTA_EXCEEDED` (resource `api_keys`): `is_active: true` re-activates a revoked
            key while the organization is at its API-key limit. Turning a key off, or
            re-activating a system key, never fails on quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [API Keys]
      summary: Revoke API key
      operationId: revokeApiKey
      responses:
        '204':
          description: API key revoked
        '404':
          description: API key not found

  /api/v1/webhooks/{org_id}/custom:
    parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID (UUID)
        example: org_a1b2c3d4e5f6
    post:
      tags: [Webhooks]
      summary: Custom webhook
      description: |
        Receive webhook events from any external source and create jobs automatically.

        Each organization has a unique webhook URL. Configure your external services
        (payment providers, form handlers, CI/CD pipelines, etc.) to POST events here.

        ## Authentication

        You must include the organization’s webhook token in the `X-Webhook-Token` header.

        To configure a webhook token:
        ```
        GET /api/v1/organizations/webhook-token
        POST /api/v1/organizations/webhook-token/regenerate
        ```

        ## Security

        - In production, HTTPS is required (HTTP webhooks are rejected)
        - Use idempotency keys to handle retries from external services. An empty or
          whitespace-only `idempotency_key` is no key: each delivery creates its own job (before
          0.1.126 all blank keys of an organization shared one job)
        - The payload is stored as-is, validate in your worker. A payload that contains the NUL
          character (`\u0000`) in a string or an object key is a `400`, as on `POST /jobs`
      operationId: customWebhook
      security: []
      parameters:
        - name: X-Webhook-Token
          in: header
          required: true
          schema:
            type: string
          description: |
            Webhook authentication token (required).
          example: your-secret-webhook-token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomWebhookRequest'
            examples:
              payment:
                summary: Payment webhook
                value:
                  queue_name: payments
                  event_type: payment.completed
                  payload:
                    payment_id: pay_xyz789
                    amount: 5000
                    currency: usd
                  idempotency_key: payment-pay_xyz789
              form:
                summary: Form submission
                value:
                  queue_name: form-submissions
                  event_type: contact.form
                  payload:
                    name: Jane Doe
                    email: jane@example.com
                    message: I have a question
              deployment:
                summary: CI/CD deployment
                value:
                  queue_name: deployments
                  event_type: deploy.triggered
                  priority: 10
                  payload:
                    repo: my-app
                    branch: main
                    commit: abc123def
                  idempotency_key: deploy-abc123def
      responses:
        '200':
          description: Webhook received and job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
              example:
                job_id: job_550e8400e29b41d4
                queue_name: payments
                status: pending
        '400':
          description: >-
            Invalid request (missing queue_name, a queue name a worker cannot claim, payload too
            large, a payload containing `\u0000` (`payload_contains_nul`), etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing X-Webhook-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: authentication_error
                message: Invalid or missing X-Webhook-Token
        '404':
          description: Organization not found, or soft-deleted

  /api/v1/webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: Inbound webhook log
      description: |
        The INBOUND request log: recent requests accepted by `POST /api/v1/webhooks/{org_id}/custom`
        for the caller's organization, newest first. It is empty for an organization that only
        sends webhooks. The deliveries Spooled makes to your own endpoints (outgoing webhooks) are
        not here: read them per webhook at `GET /api/v1/outgoing-webhooks/{id}/deliveries`.
        Entries carry neither the request payload nor any signature.
        Requires an unrestricted key. The body is a bare array; the `X-Has-More` response header
        says whether another page follows (since 0.1.124).
      operationId: listInboundWebhookDeliveries
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [created, duplicate]
          description: Only requests that created a job, or matched an existing one (idempotency key).
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: RFC 3339 instant; only entries received at or after it.
        - name: queue_name
          in: query
          schema:
            type: string
            maxLength: 255
          description: Only entries whose job went to this queue (alias `queue`).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Entries per page
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
          description: Entries to skip
      responses:
        '200':
          description: Inbound webhook requests
          headers:
            X-Has-More:
              description: '`true` when another page follows, else `false`'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboundWebhookDelivery'
        '400':
          description: Invalid `status`, `since` or `queue_name` (over 255 characters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
        '403':
          description: The API key is restricted to queues (`ACCESS_DENIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Workflow Endpoints
  /api/v1/workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      description: List all workflows for the organization
      operationId: listWorkflows
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowResponse'
    post:
      tags: [Workflows]
      summary: Create workflow
      description: |
        Create a new workflow with multiple jobs and dependencies.
        Jobs within a workflow can have dependencies on other jobs,
        creating a DAG of job execution.

        At most 100 jobs. Each job's `queue_name` follows the claim rules, `priority` is
        -100..100, `max_retries` 0..100, `timeout_seconds` 1..86400 and `expires_at`, when sent,
        must be in the future; otherwise the request is a `400 VALIDATION_ERROR` (before 0.1.128 an
        out-of-range `priority` was a `500` and the other two numbers were stored clamped). The job
        `key` rules of `POST /jobs` are not applied.
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '200':
          description: >-
            Workflow created. The status is `200`, not `201`. The body maps each job `key` to its
            job id (`job_ids`); the jobs in `GET /workflows/{id}` carry the same `key` (since 0.1.129).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowResponse'
        '400':
          description: >-
            Invalid workflow definition: a circular dependency, an unknown key in `depends_on`, a
            job that lists the same key twice in `depends_on` (it used to be a 500), or a job
            field outside the ranges above (`VALIDATION_ERROR`)

  /api/v1/workflows/{id}:
    get:
      tags: [Workflows]
      summary: Get workflow
      description: |
        Get workflow details including progress.

        In the returned `jobs`, `key` is the step key the job was created with (`jobs[].key` on
        create; null for workflows created before 0.1.129, which did not store it), `job_type` is
        the payload's `job_type` (`"job"` when the payload has none), `failed_at` is the failure
        time of a `failed` or `deadletter` job (null otherwise) and `backoff_type` is always
        `exponential`. A workflow turns `running`, with
        `started_at` set, within about 10 s of its first job being claimed.

        `progress` has `total`, `completed`, `failed`, `pending`, `processing` and `cancelled`.
        `failed` counts failed and dead-lettered jobs, the same as `failed_jobs` in the list;
        cancelled jobs are counted in `cancelled` (until 0.1.128 they were added to `failed`).
      operationId: getWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '404':
          description: Workflow not found

  /api/v1/workflows/{id}/cancel:
    post:
      tags: [Workflows]
      summary: Cancel workflow
      description: |
        Cancel a workflow and all its pending jobs. Only a `pending` or `running` workflow can be
        cancelled; a `completed`, `failed` or `cancelled` one is a `409` and keeps its outcome and
        `completed_at` (cancelling used to overwrite them).
      operationId: cancelWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '404':
          description: Workflow not found
        '409':
          description: The workflow is already completed, failed or cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/workflows/{id}/retry:
    post:
      tags: [Workflows]
      summary: Retry failed workflow
      description: |
        Retry all failed jobs in a workflow. This resets failed/deadletter jobs
        back to pending status, clears retry counts and error messages, and
        resumes the workflow. Steps the scheduler cancelled because a dependency failed are
        reopened too; a step someone cancelled stays cancelled.

        Only workflows with status 'failed' can be retried.

        A running workflow counts toward the plan's `max_workflows` (only pending and running
        workflows count), so retrying takes a slot: the call is refused with `429 QUOTA_EXCEEDED`
        when the organization is at its limit, and with `403` (`feature_disabled`) on a plan
        without workflows.
      operationId: retryWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow retry initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          description: Workflow cannot be retried (not in failed status)
        '403':
          description: Workflows are not available on the organization's plan (`feature_disabled`)
        '404':
          description: Workflow not found
        '429':
          description: >-
            `QUOTA_EXCEEDED` (resource `workflows`): retrying would exceed the plan's limit of
            pending and running workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/jobs/{id}/dependencies:
    get:
      tags: [Workflows]
      summary: Get job dependencies
      description: Get the dependencies and dependents of a job
      operationId: getJobDependencies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobWithDependencies'
    post:
      tags: [Workflows]
      summary: Add job dependencies
      description: |
        Add dependencies to an existing job. Every requested edge is checked before anything
        changes: a dependency on the job itself, or an edge that would close a cycle, is a `400`
        (it used to be skipped with `dependencies_added: 0`). The job's `dependency_mode` and
        `dependencies_met` change only when at least one edge was added; when every edge already
        existed the job is unchanged and `dependencies_added` is 0.
      operationId: addJobDependencies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDependenciesRequest'
      responses:
        '200':
          description: Dependencies added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDependenciesResponse'
        '400':
          description: A dependency on the job itself, or one that would create a cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Real-time Endpoints
  /api/v1/ws:
    get:
      tags: [Real-time]
      summary: WebSocket connection
      description: |
        Establish a WebSocket connection for real-time updates.

        ## Authentication
        **Required**: Pass your JWT token in the `token` query parameter.
        WebSocket connections cannot use headers for authentication.

        ```
        wss://api.spooled.cloud/api/v1/ws?token=eyJ...
        ```

        ## Connection
        Connect to this endpoint and upgrade to WebSocket protocol.

        ## Events
        The server will send events for:
        - Job status changes
        - Queue statistics updates
        - Worker heartbeats
        - System health updates

        ## Filtering
        Use query parameters to filter events:
        - `queue`: Filter by queue name
        - `job_id`: Filter by specific job
        - `events`: Comma-separated event types

        ## Client Commands
        Send JSON messages to subscribe/unsubscribe:
        ```json
        {"cmd": "Subscribe", "queue": "emails", "job_id": null}
        {"cmd": "Unsubscribe", "queue": "emails", "job_id": null}
        {"cmd": "Ping"}
        ```

        Since 0.1.126 `cmd` is case-insensitive (`"subscribe"` as the Go, Python and PHP SDKs send
        it), `type` works in its place, and `queues: ["emails", "billing"]` is read next to `queue`.
        A missing field, `null` and `""` all mean "not set". A frame that is not a command, or
        that names an invalid queue, gets an `Error` event and the socket stays open; `Ping` is
        answered with a `Ping` event. A queue outside the key's scope is ignored.

        Subscriptions add up and an event is delivered when **any** of them matches (the
        `queue` / `job_id` of the upgrade URL is the first one; a socket with none receives
        everything the key's scope allows). One subscribe adds one subscription per named queue;
        its `job_id` is combined (AND) with each of those queues. An unsubscribe removes the
        subscriptions whose named fields all match, and removes nothing when it names nothing.

        ## Lifetime and close codes
        The socket lives as long as the credential it was opened with. The server re-checks
        the access token's session (logout), the API key (revoked, expired, organization
        deleted) and the key's queue scope at most every 2 s before it reveals an event, and on
        every ping. It closes the socket with:

        - `1008` when the access token expires (`exp` plus a 60 s validation leeway) or the
          token, session or key is revoked. The server sends an `Error` event first; do not
          reconnect with the same token.
        - `1000` after a maximum age of 1 hour. Reconnect.
        - `1011`, after an `Error` event, when the Redis event channel could not be opened or
          closed, or the authorization lookup failed. Reconnect.

        At most 100 WebSockets per organization are open at once; the next gets `429`.
      operationId: websocketHandler
      parameters:
        - name: token
          in: query
          required: true
          description: JWT authentication token
          schema:
            type: string
        - name: queue
          in: query
          schema:
            type: string
        - name: job_id
          in: query
          schema:
            type: string
        - name: events
          in: query
          description: Comma-separated event types
          schema:
            type: string
      responses:
        '101':
          description: Switching to WebSocket protocol
        '401':
          description: Invalid token, or it expired between authentication and the upgrade
        '429':
          description: Too many WebSocket connections for the organization (100)

  /api/v1/events:
    get:
      tags: [Real-time]
      summary: Server-Sent Events stream
      description: |
        Every realtime event of the organization, as named SSE events
        (`event: job.created`, `job.status`, `job.completed`, `job.failed`, ...,
        plus `system.health` every 10 s). Each `data:` is the
        `{"type": "<Variant>", "data": {...}}` envelope. The key's queue scope
        always applies. Before 0.1.114 this stream only emitted `system.health`.

        When the stream's event channel cannot be opened or is lost, the server sends an
        `error` event and ends the stream, so the client reconnects (since 0.1.126; before, the
        stream stayed open with only `system.health`). Without Redis configured it carries
        `system.health` only.

        All four realtime endpoints end when the access JWT they were opened with expires
        (`exp` plus a 60 s validation leeway) or its session is logged out, and when the key is
        revoked or expired or the organization is deleted (re-checked at most every 2 s). SSE
        streams also end after 30 minutes; reconnect. At most 100 `/events` streams per
        organization are open at once.
      operationId: sseEventsHandler
      parameters:
        - name: queue
          in: query
          description: Only events for this queue (must be inside the key's scope, else 403)
          schema:
            type: string
        - name: job_id
          in: query
          description: Only events for this job
          schema:
            type: string
        - name: events
          in: query
          description: Comma-separated event names to keep (e.g. `job.created,job.completed`)
          schema:
            type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'
        '401':
          description: Invalid token, or it expired between authentication and the start of the stream
        '429':
          description: Too many SSE connections for the organization (100 `/events` streams)

  /api/v1/events/jobs/{id}:
    get:
      tags: [Real-time]
      summary: Job status SSE stream
      description: |
        Subscribe to status updates for a specific job. The stream ends when the job reaches a
        terminal status, when the access token expires or its session is logged out, and after
        30 minutes. At most 100 job streams per organization are open at once.
      operationId: sseJobHandler
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream for job status
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'
        '401':
          description: Invalid token, or it expired between authentication and the start of the stream
        '404':
          description: |
            Unknown job id, a job of another organization, or a job in a queue outside the key's
            scope: the same `NOT_FOUND` error as `GET /api/v1/jobs/{id}`, answered before any
            stream starts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many SSE connections for the organization (100 job streams)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/queues/{name}:
    get:
      tags: [Real-time]
      summary: Queue stats SSE stream
      description: |
        Subscribe to statistics updates for a specific queue. The counts are computed once per
        queue every few seconds and shared by all streams of that queue. The stream ends when
        the access token expires or its session is logged out, and after 30 minutes. At most 100
        queue streams per organization are open at once.
      operationId: sseQueueHandler
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream for queue stats
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'
        '401':
          description: Invalid token, or it expired between authentication and the start of the stream
        '403':
          description: |
            The queue is outside the API key's queue scope (the error of the REST queue routes),
            answered before any stream starts. A queue inside the scope that holds no jobs yet
            streams zero counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many SSE connections for the organization (100 queue streams)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Schedule (Cron) Endpoints
  /api/v1/schedules:
    get:
      tags: [Schedules]
      summary: List schedules
      description: |
        List cron-based job schedules, newest first (ties broken by id so `offset` pages are
        stable). `queue_name`, `is_active` and `offset` were ignored before 0.1.121, so a
        filtered call returned every schedule.
      operationId: listSchedules
      parameters:
        - name: organization_id
          in: query
          schema:
            type: string
        - name: queue_name
          in: query
          schema:
            type: string
          description: Only schedules that target this queue
        - name: is_active
          in: query
          schema:
            type: boolean
          description: >-
            Only active (`true`) or paused (`false`) schedules. `true`, `false`, `1` and `0` are
            accepted in any case; anything else is a 400.
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of schedules to skip
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '400':
          description: '`is_active` is not a boolean'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Schedules]
      summary: Create schedule
      description: Create a new cron-based recurring job schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScheduleResponse'
        '400':
          description: >-
            Invalid cron expression or validation error. A cron expression whose date never occurs
            (`0 0 30 2 *`, `0 0 31 4 *`) or that has no upcoming run time is refused; such a
            schedule used to be stored with `next_run_at: null` and never fire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedules/{id}:
    get:
      tags: [Schedules]
      summary: Get schedule
      description: Get a schedule by ID
      operationId: getSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Schedule not found
    put:
      tags: [Schedules]
      summary: Update schedule
      description: |
        Update an existing schedule. A new `cron_expression` or `timezone` recomputes the next
        run and is a `400` when the expression names a date that never occurs or has no upcoming
        run.

        `is_active: true` on a paused schedule re-activates it like `POST /schedules/{id}/resume`:
        it is checked against the plan's schedule limit (429 `QUOTA_EXCEEDED`) and the next run is
        computed from the current time, so the run missed while paused does not fire. Turning a
        schedule off never fails on quota.

        A `payload_template` larger than the plan's payload cap (Free 64 KB, Starter 256 KB) is a
        `403`, as on create, and nothing is written. A template already stored is not checked again
        by an update that does not send one.
      operationId: updateSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          description: Invalid cron expression (including a date that never occurs) or timezone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`payload_template` is larger than the plan''s payload cap'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Schedule not found
        '429':
          description: >-
            `QUOTA_EXCEEDED` (resource `schedules`): `is_active: true` re-activates a paused
            schedule while the organization is at its schedule limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Schedules]
      summary: Delete schedule
      description: Delete a schedule
      operationId: deleteSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Schedule deleted
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/pause:
    post:
      tags: [Schedules]
      summary: Pause schedule
      description: Temporarily pause a schedule from creating jobs
      operationId: pauseSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/resume:
    post:
      tags: [Schedules]
      summary: Resume schedule
      description: Resume a paused schedule
      operationId: resumeSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/trigger:
    post:
      tags: [Schedules]
      summary: Trigger schedule
      description: >-
        Manually trigger a schedule to create a job immediately. A schedule stored with a queue
        name a worker cannot claim (created before 0.1.126) answers `400` and enqueues nothing;
        the cron tick records a `failed` run for it and moves on.
      operationId: triggerSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule triggered, job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerScheduleResponse'
        '400':
          description: The schedule's queue name is not one a worker can claim
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/history:
    get:
      tags: [Schedules]
      summary: Schedule history
      description: |
        Get the execution history of a schedule, newest run first.

        `status` follows the job a run enqueued, so a run is not `completed` while its job is
        still waiting (since 0.1.125; before, it read `completed` as soon as the job existed):

        | job (`job_status`) | `status` | `completed_at` |
        |--------------------|----------|----------------|
        | `pending`, `scheduled` | `pending` | `null` |
        | `processing` | `running` | `null` |
        | `completed` | `completed` | the job's `completed_at` |
        | `failed`, `deadletter`, `cancelled` | `failed` | the job's `completed_at` (the run's if the job has none) |
        | none: the run enqueued nothing (for example a daily-limit refusal), or retention removed the job | the run's own status (`completed` or `failed`) | the run's |

        `job_status` is the job's raw current status (`null` when there is no job). `status` is
        always one of `pending`, `running`, `completed`, `failed`.
      operationId: getScheduleHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Schedule run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleRun'
        '404':
          description: Schedule not found

  # Outgoing Webhook Endpoints
  /api/v1/outgoing-webhooks:
    get:
      tags: [Outgoing Webhooks]
      summary: List outgoing webhooks
      description: List all configured outgoing webhooks for the organization
      operationId: listOutgoingWebhooks
      responses:
        '200':
          description: List of outgoing webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutgoingWebhook'
    post:
      tags: [Outgoing Webhooks]
      summary: Create outgoing webhook
      description: |
        Create a new outgoing webhook configuration.
        The webhook will be called when any of the subscribed events occur.

        Deliveries (and `POST /outgoing-webhooks/{id}/test`, and the per-job `completion_webhook`
        callbacks) never follow redirects: a `3xx` answer is the response, the delivery is
        `failed` with that status code and `HTTP 3xx` as its error, and it is retried like any
        other non-2xx answer. Configure the final URL.
      operationId: createOutgoingWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutgoingWebhookRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingWebhook'
        '400':
          description: Invalid request

  /api/v1/outgoing-webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Webhook ID
    get:
      tags: [Outgoing Webhooks]
      summary: Get outgoing webhook
      operationId: getOutgoingWebhook
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingWebhook'
        '404':
          description: Webhook not found
    put:
      tags: [Outgoing Webhooks]
      summary: Update outgoing webhook
      description: |
        Partial update. Omitted fields keep their current value, with one
        destructive exception: an explicit `"secret": null` clears the signing
        secret and later deliveries go out unsigned.

        Setting `"enabled": true` on a webhook that was auto-disabled counts
        against the plan webhook cap, so it can be rejected with
        429 QUOTA_EXCEEDED.

        Turning a webhook on (false to true) or changing its `url` resets `failure_count` to 0,
        so the first failed delivery after a fix does not disable it again. `last_status` is
        left as it is.
      operationId: updateOutgoingWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutgoingWebhookRequest'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingWebhook'
        '404':
          description: Webhook not found
        '429':
          description: Plan webhook cap reached (QUOTA_EXCEEDED) when re-enabling
    delete:
      tags: [Outgoing Webhooks]
      summary: Delete outgoing webhook
      operationId: deleteOutgoingWebhook
      responses:
        '204':
          description: Webhook deleted
        '404':
          description: Webhook not found

  /api/v1/outgoing-webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Outgoing Webhooks]
      summary: Test outgoing webhook
      description: >-
        Send a test payload to the webhook URL to verify connectivity. Redirects are not
        followed: a `3xx` answer is `success: false` with `HTTP 3xx` as the error.
      operationId: testOutgoingWebhook
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestWebhookResponse'
        '404':
          description: Webhook not found

  /api/v1/outgoing-webhooks/{id}/deliveries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Outgoing Webhooks]
      summary: Get webhook delivery history
      description: |
        Get the delivery history for an outgoing webhook: the OUTGOING deliveries Spooled made to
        that webhook's URL. The newest 100 deliveries per webhook are readable. (The inbound
        request log of `POST /api/v1/webhooks/{org_id}/custom` is a different list, at
        `GET /api/v1/webhooks/deliveries`.)

        History is retained for the organization's plan history_retention_days
        (free 1, starter 7, pro 30, enterprise 90); older delivery rows are
        removed by the retention sweep and can no longer be listed or retried.
      operationId: getOutgoingWebhookDeliveries
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutgoingWebhookDelivery'
        '404':
          description: Webhook not found

  /api/v1/outgoing-webhooks/{id}/retry/{delivery_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Webhook ID
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
        description: Delivery ID
    post:
      tags: [Outgoing Webhooks]
      summary: Retry webhook delivery
      description: |
        Trigger a retry for a specific outgoing webhook delivery attempt.
        
        A successful retry resets the webhook's failure_count to 0. If the webhook's stored URL is
        rejected by the SSRF policy, the answer is `200` with `success: false` (it used to be a
        `500`) and the rejection counts as a failed delivery.

        **Limitations:**
        - Cannot retry successful deliveries (returns 400)
        - Maximum 10 total attempts per delivery (returns 400 when exceeded)
        - Deliveries removed by the plan retention sweep can no longer be retried
        - Only one retry of a delivery sends at a time. A retry that loses to another retry of the
          same delivery (the automatic retry waiting out its backoff, or a second click) answers
          `409` and sends nothing; a delivery that succeeded in the meantime answers success
      operationId: retryOutgoingWebhookDelivery
      responses:
        '200':
          description: Retry initiated
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Bad request (delivery already successful or max attempts exceeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook or delivery not found
        '409':
          description: >-
            `CONFLICT` ("A retry of this delivery is already in progress"): another retry of this
            delivery owns it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  responses:
    AuthUnavailable:
      description: |
        Authentication is temporarily unavailable: the database could not be reached while
        the credential was checked (`code` `SERVICE_UNAVAILABLE`). Safe to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVICE_UNAVAILABLE
            message: Authentication is temporarily unavailable

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key in Bearer token format
    AdminKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Admin API key for platform administration

  schemas:
    HealthResponse:
      type: object
      required: [status, database, cache]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          description: '`degraded` when the database, Redis, the gRPC server or the scheduler is not healthy'
        version:
          type: string
          description: Not returned by the unauthenticated health check
        database:
          type: boolean
        cache:
          type: boolean
          description: Redis answers (or is not configured)
        grpc:
          type: boolean
          description: The gRPC server is accepting calls. Omitted when the process runs without it.
        scheduler:
          type: boolean
          description: The background scheduler is running and finished a pass within the last 120 s. Omitted when the process runs without it.

    # Authentication Schemas
    LoginRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          description: API key to exchange for JWT tokens
          minLength: 10

    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: JWT access token (short-lived)
        refresh_token:
          type: string
          description: JWT refresh token (long-lived)
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token expiration in seconds
        refresh_expires_in:
          type: integer
          description: Refresh token expiration in seconds

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Valid refresh token

    RefreshTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: New JWT access token
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token expiration in seconds

    CurrentUserResponse:
      type: object
      required: [organization_id, api_key_id, queues, issued_at, expires_at]
      properties:
        organization_id:
          type: string
        api_key_id:
          type: string
        queues:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ValidateTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT token to validate

    ValidateTokenResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        error:
          type: string
          description: Why the token is not accepted, when `valid` is `false`
        claims:
          type: object
          description: Token claims if valid

    # Schedule Schemas
    Schedule:
      type: object
      required:
        [id, organization_id, name, cron_expression, timezone, queue_name, is_active, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        description:
          type: string
        cron_expression:
          type: string
          description: 'Cron expression: 5-field (minute hour day month weekday) or 6-field (leading seconds). 5-field defaults seconds to 0.'
          example: '0 */5 * * * *'
        timezone:
          type: string
          default: UTC
        queue_name:
          type: string
        payload_template:
          type: object
        priority:
          type: integer
          default: 0
        max_retries:
          type: integer
          default: 3
        timeout_seconds:
          type: integer
          default: 300
        is_active:
          type: boolean
        last_run_at:
          type: string
          format: date-time
        next_run_at:
          type: string
          format: date-time
        run_count:
          type: integer
        tags:
          type: object
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateScheduleRequest:
      type: object
      required: [name, cron_expression, queue_name, payload_template]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        cron_expression:
          type: string
          description: >-
            Cron expression (5-field, or 6-field with leading seconds). When both day fields
            (day-of-month and day-of-week) are restricted, a day matches if either does; a field
            that starts with `*` (`*` or `*/N`) is unrestricted, so the day fields then combine
            with AND (`0 0 */2 * 1` = odd days that are Mondays), as in Vixie cron. A date that
            never occurs (`0 0 30 2 *`) is a 400.
        timezone:
          type: string
          default: UTC
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Letters, digits, `-`, `_` and `.`, not starting with `.` or `-`: the names
            `POST /jobs/claim` accepts. 1-100 characters, `400` otherwise (since 0.1.126; before,
            255 characters and any character were stored and the jobs could not be claimed).
        payload_template:
          type: object
        priority:
          type: integer
          minimum: -100
          maximum: 100
        max_retries:
          type: integer
          minimum: 0
          maximum: 100
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        tags:
          type: object
        metadata:
          type: object

    CreateScheduleResponse:
      type: object
      required: [id, name, cron_expression]
      properties:
        id:
          type: string
        name:
          type: string
        cron_expression:
          type: string
        next_run_at:
          type: string
          format: date-time

    UpdateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        cron_expression:
          type: string
        timezone:
          type: string
        payload_template:
          type: object
        priority:
          type: integer
        max_retries:
          type: integer
        timeout_seconds:
          type: integer
        is_active:
          type: boolean
        tags:
          type: object
        metadata:
          type: object

    TriggerScheduleResponse:
      type: object
      required: [job_id, triggered_at]
      properties:
        job_id:
          type: string
        triggered_at:
          type: string
          format: date-time

    ScheduleRun:
      type: object
      required: [id, schedule_id, status, started_at]
      properties:
        id:
          type: string
        schedule_id:
          type: string
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
          description: |
            Follows the enqueued job: `pending` while the job is `pending` or `scheduled`,
            `running` while it is `processing`, `completed` once it completed, `failed` when it
            ended `failed`, `deadletter` or `cancelled`. A run with no job (nothing was
            enqueued, or retention removed the job) keeps the status stored with the run.
        error_message:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            `null` while the job is `pending` or `running`; the job's `completed_at` once it
            ended (the run's own time when the job has none, or when there is no job).
        job_status:
          type: string
          nullable: true
          description: Current status of the job this run enqueued (null if none, or purged by retention)

    ErrorResponse:
      type: object
      description: |
        Every 4xx/5xx response is JSON with at least `code` and `message` (since
        0.1.114 this also covers extractor rejections, unknown routes and 405s).
        Some errors add fields — `details` for validation, `resource`/`limit`/`upgrade_to` for
        quotas, a legacy `error` string on auth routes. `429` is either `RATE_LIMIT_EXCEEDED`
        (has `Retry-After`) or `QUOTA_EXCEEDED` (a plan limit; no `Retry-After`, `upgrade_to`
        names the next plan when there is one).
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details

    Organization:
      type: object
      required: [id, name, slug, plan_tier, settings, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
        billing_email:
          type: string
          format: email
          description: Stored lower-cased.
        billing_email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the billing email was confirmed (email signup, the confirmation
            code flow, or an operator). Null means email login does not resolve
            this organization by the address. Changing `billing_email` on an
            organization whose address is not confirmed clears it; on one whose
            address is confirmed the new address waits in `pending_billing_email`
            and this stays set.
        pending_billing_email:
          type: string
          format: email
          nullable: true
          description: |
            A new billing email waiting for its confirmation code. The confirmed
            `billing_email` keeps resolving email login (and stays the Stripe
            address) until the pending one is confirmed and replaces it. Null
            when no change is pending.
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationMember:
      type: object
      description: An active API key of the organization, listed as a member
      required: [id, user_id, email, name, role, joined_at]
      properties:
        id:
          type: string
          description: API key id
        user_id:
          type: string
          description: Same as `id` (there are no user accounts)
        email:
          type: string
          description: The organization's billing email (empty when none is set)
        name:
          type: string
          description: API key name
        role:
          type: string
          enum: [owner, member]
          description: '`owner` when the key''s `queues` include `*`'
        joined_at:
          type: string
          format: date-time
          description: When the key was created
        invited_by:
          type: string
          description: Not set today

    BillingEmailVerificationResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [code_sent, verified]
        email_sent_to:
          type: string
          description: Masked address the code went to (only with `code_sent`)

    OrganizationSummary:
      type: object
      required: [id, name, slug, plan_tier, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
        billing_email:
          type: string
          format: email

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        billing_email:
          type: string
          format: email
          description: |
            On an organization with a confirmed billing email, a different address is stored in
            `pending_billing_email` and the confirmed one stays active until the new address is
            confirmed; sending the active address again withdraws a pending change. On an
            organization without a confirmed address the new one replaces `billing_email`,
            unconfirmed.
        settings:
          type: object

    JobHistoryEvent:
      type: object
      required: [id, job_id, event_type, details, created_at]
      properties:
        id:
          type: string
        job_id:
          type: string
        event_type:
          type: string
          description: >-
            Lifecycle event: `processing`, `completed`, `retry_scheduled` or `deadlettered`
            (`created` exists, but only the internal queue manager's enqueue writes it and no
            REST or gRPC handler calls that). Events are recorded by REST claim, complete and
            fail, by the scheduler's dead-letter sweeps and, since 0.1.126, by its requeues of an
            expired lease or an offline worker and by a worker deregister that releases an expired
            lease (`retry_scheduled`); gRPC settlements record none.
        worker_id:
          type: [string, 'null']
        details:
          type: object
          description: Event details (at most 64 KB)
        created_at:
          type: string
          format: date-time

    Job:
      type: object
      required:
        [
          id,
          organization_id,
          queue_name,
          status,
          payload,
          retry_count,
          max_retries,
          timeout_seconds,
          priority,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        queue_name:
          type: string
        status:
          type: string
          enum: [pending, scheduled, processing, completed, failed, deadletter, cancelled]
          description: >-
            `scheduled` is a job waiting for a future `scheduled_at`, which includes a job that
            failed and waits for its retry backoff (since 0.1.126; before, that read `pending`).
            `pending` is claimable now.
        payload:
          type: object
        result:
          type: object
        retry_count:
          type: integer
        max_retries:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        priority:
          type: integer
        tags:
          type: object
        timeout_seconds:
          type: integer
        parent_job_id:
          type: string
        completion_webhook:
          type: string
          format: uri
        assigned_worker_id:
          type: string
        lease_id:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
        updated_at:
          type: string
          format: date-time

    JobSummary:
      type: object
      required: [id, queue_name, status, priority, attempt, max_retries, job_type, created_at]
      properties:
        id:
          type: string
        queue_name:
          type: string
        status:
          type: string
        priority:
          type: integer
        attempt:
          type: integer
          description: Retry count (serialized as attempt, not retry_count)
        max_retries:
          type: integer
        job_type:
          type: string
          description: |
            From payload.job_type (there is no column). An empty string when the payload names
            no type; same on `GET /jobs` and `GET /jobs/dlq`.
        last_error:
          type: string
          nullable: true
          description: Last failure message when the job has failed or dead-lettered
        created_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    CreateJobRequest:
      type: object
      required: [queue_name, payload]
      properties:
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
        payload:
          type: object
        priority:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
        max_retries:
          type: integer
          minimum: 0
          maximum: 100
          default: 3
          description: Omitted → the queue's `max_retries` from `PUT /queues/{name}/config`, else the server default (3)
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
          description: Omitted → the queue's `default_timeout`, else the server default (300)
        scheduled_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Must be in the future and later than `scheduled_at` (otherwise a 400)
        tags:
          type: object
        parent_job_id:
          type: string
        completion_webhook:
          type: string
          format: uri
        completion_webhook_secret:
          type: string
          description: >-
            Optional shared secret. When set, the completion callback carries
            `X-Spooled-Timestamp` and `X-Spooled-Signature` (`sha256=` HMAC of
            `{timestamp}.{rawBody}`). The body is
            `{id, event, created_at, data: {job_id, queue_name, status, result | error}}`.
            Success sends `event: job.completed` and `data.result`; failure sends
            `event: job.failed` and `data.error` (`data.status` may be `deadletter`).
            There is no `data.completed_at`.
        idempotency_key:
          type: string
          maxLength: 255
          description: >-
            Deduplicates jobs per organization for as long as the job row exists (no time-to-live).
            An empty or whitespace-only value is treated as no key.

    CreateJobResponse:
      type: object
      required: [id, created]
      properties:
        id:
          type: string
          description: Job ID (new or existing if idempotent)
        created:
          type: boolean
          description: Whether this was a new job or existing

    JobStats:
      type: object
      required: [pending, scheduled, processing, completed, failed, deadletter, cancelled, total]
      properties:
        pending:
          type: integer
        scheduled:
          type: integer
        processing:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        deadletter:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer

    QueueConfig:
      type: object
      required:
        [
          id,
          organization_id,
          queue_name,
          max_retries,
          default_timeout,
          enabled,
          settings,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        queue_name:
          type: string
        max_retries:
          type: integer
        default_timeout:
          type: integer
        rate_limit:
          type: integer
          description: Stored and returned; not enforced yet (planned).
        enabled:
          type: boolean
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QueueConfigSummary:
      type: object
      required: [queue_name, max_retries, default_timeout, enabled]
      properties:
        queue_name:
          type: string
        max_retries:
          type: integer
        default_timeout:
          type: integer
        rate_limit:
          type: integer
          description: Stored and returned; not enforced yet (planned).
        enabled:
          type: boolean

    UpsertQueueConfigRequest:
      type: object
      properties:
        queue_name:
          type: string
          description: 'Optional and ignored; the queue is named by the `{name}` path parameter'
        max_retries:
          type: integer
          minimum: 0
          maximum: 100
          description: Values outside 0-100 are a 400
        default_timeout:
          type: integer
          minimum: 1
          maximum: 86400
          description: Seconds. Values outside 1-86400 are a 400
        rate_limit:
          type: integer
          minimum: 1
          maximum: 100000
          description: >-
            Values outside 1-100000 are a 400 (they were clamped). Stored and returned; not
            enforced yet (planned). Workers are not throttled to this many jobs per second.
        enabled:
          type: boolean
        settings:
          type: object

    QueueStats:
      type: object
      required:
        [
          queue_name,
          pending_jobs,
          processing_jobs,
          completed_jobs_24h,
          failed_jobs_24h,
          deadletter_jobs,
          active_workers,
        ]
      properties:
        queue_name:
          type: string
        pending_jobs:
          type: integer
        processing_jobs:
          type: integer
        completed_jobs_24h:
          type: integer
        failed_jobs_24h:
          type: integer
          description: Jobs dead-lettered in the last 24 hours (it counted a status no job has and was always 0)
        deadletter_jobs:
          type: integer
          description: Jobs in the queue's dead-letter queue now
        avg_processing_time_ms:
          type: number
        max_job_age_seconds:
          type: integer
        active_workers:
          type: integer

    Worker:
      type: object
      required:
        [
          id,
          organization_id,
          queue_name,
          queue_names,
          hostname,
          max_concurrency,
          current_jobs,
          status,
          last_heartbeat,
          metadata,
          registered_at,
          updated_at,
          jobs_processed,
          jobs_failed,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        queue_name:
          type: string
        queue_names:
          type: array
          items:
            type: string
        hostname:
          type: string
        worker_type:
          type: string
        max_concurrency:
          type: integer
        current_jobs:
          type: integer
        status:
          type: string
          enum: [healthy, degraded, offline, draining]
        last_heartbeat:
          type: string
          format: date-time
        metadata:
          type: object
        version:
          type: string
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        jobs_processed:
          type: integer
          format: int64
          description: Jobs this worker completed (counted since 0.1.122)
        jobs_failed:
          type: integer
          format: int64
          description: >-
            Failures this worker reported (a retry scheduled or a dead-letter); jobs released by
            lease-expiry sweeps, and a job the server dead-letters because it is too large for a
            gRPC message, are not counted

    WorkerSummary:
      type: object
      required:
        [
          id,
          queue_name,
          hostname,
          status,
          current_jobs,
          max_concurrency,
          last_heartbeat,
          jobs_processed,
          jobs_failed,
        ]
      properties:
        id:
          type: string
        queue_name:
          type: string
        hostname:
          type: string
        status:
          type: string
        current_jobs:
          type: integer
        max_concurrency:
          type: integer
        last_heartbeat:
          type: string
          format: date-time
        jobs_processed:
          type: integer
          format: int64
          description: Jobs this worker completed (counted since 0.1.122)
        jobs_failed:
          type: integer
          format: int64
          description: Failures this worker reported (see Worker.jobs_failed)

    RegisterWorkerRequest:
      type: object
      required: [queue_name, hostname]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._-]+$'
          description: >-
            Optional stable worker id. Supply the same value across restarts and
            registration upserts a single row, so a restarting worker reclaims
            its identity instead of leaving the old row to occupy the plan's
            worker cap until the stale-worker reaper clears it (about two
            minutes). Omit it and the server mints a UUID, which is the previous
            behaviour. An id already owned by a different organization is
            rejected with 409, and so is, for a queue-scoped key, an id of a
            worker of this organization that serves a queue outside the key's
            scope (one neutral message for both).
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Letters, digits, `-`, `_` and `.`, not starting with `.` or `-`: the names
            `POST /jobs/claim` accepts.
        hostname:
          type: string
          minLength: 1
          maxLength: 255
        worker_type:
          type: string
          maxLength: 50
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        metadata:
          type: object
        version:
          type: string
          maxLength: 50

    RegisterWorkerResponse:
      type: object
      required: [id, queue_name, lease_duration_secs, heartbeat_interval_secs]
      properties:
        id:
          type: string
        queue_name:
          type: string
        lease_duration_secs:
          type: integer
        heartbeat_interval_secs:
          type: integer

    WorkerHeartbeatRequest:
      type: object
      required: [current_jobs]
      properties:
        current_jobs:
          type: integer
        status:
          type: string
        metadata:
          type: object

    ApiKeySummary:
      type: object
      required: [id, name, queues, is_active, is_system, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        queues:
          type: array
          items:
            type: string
          description: >-
            Queues the key may use. Empty or `*` means every queue; otherwise exact queue names
            and `prefix.*` patterns (see `CreateApiKeyRequest`).
        rate_limit:
          type: integer
          description: >-
            Per-key cap in requests per minute (1-10000). Checked together with the organization's
            plan rate limit (first, so a refusal does not use an organization token), so it can only
            lower that limit for this key, never raise it.
        is_active:
          type: boolean
        is_system:
          type: boolean
          readOnly: true
          description: >-
            True only for the key Spooled creates for email-login dashboard sessions. System keys
            do not count toward the plan's API-key limit. No request can set this field.
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
          description: >-
            Coarse activity marker, written at most once per key per five
            minutes rather than on every request. Do not read it as the
            timestamp of the most recent call.
        expires_at:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        queues:
          type: array
          items:
            type: string
          description: >-
            Queues the key may use. Each entry is an exact queue name, `*` (every queue) or
            `prefix.*`, which covers every queue whose name starts with `prefix.` (`orders.*`
            covers `orders.eu` and `orders.eu.west`, not `orders` or `ordersx`; list `orders` too
            to reach it). Any other use of `*` (`orders*`, `*.eu`, `a.*.b`) is a 400
            VALIDATION_ERROR (`invalid_queue_pattern`). A queue-scoped key can grant only queues
            it can use itself, and a `prefix.*` pattern only under one of its own patterns that is
            at least as broad. Names are case-sensitive.
        rate_limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: >-
            Per-key cap in requests per minute. Checked together with the organization's plan rate
            limit (first, so a refusal does not use an organization token), so it can only lower
            that limit for this key, never raise it.
        expires_at:
          type: string
          format: date-time
      description: |
        API keys have no per-permission scopes; narrow a key with `queues`. A
        request that sends `permissions` is rejected with 400 VALIDATION_ERROR
        rather than silently creating a full-access key.

    CreateApiKeyResponse:
      type: object
      required: [id, key, name, created_at]
      properties:
        id:
          type: string
        key:
          type: string
          description: The raw API key (only shown once)
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    UpdateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        queues:
          type: array
          items:
            type: string
          description: >-
            Same rules as `CreateApiKeyRequest.queues`: exact names, `*` and `prefix.*`; any
            other use of `*` is a 400.
        rate_limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: >-
            Per-key cap in requests per minute. Checked together with the organization's plan rate
            limit (first, so a refusal does not use an organization token), so it can only lower
            that limit for this key, never raise it.
        is_active:
          type: boolean
          description: >-
            `false` revokes the key. `true` re-activates a revoked key and is checked against
            the plan's API-key limit (429 `QUOTA_EXCEEDED`). `is_system` cannot be set.

    CustomWebhookRequest:
      type: object
      required: [queue_name, payload]
      properties:
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Letters, digits, `-`, `_` and `.`, not starting with `.` or `-`: the names
            `POST /jobs/claim` and `POST /jobs` accept, `default` and names containing `..`
            included (before 0.1.128 these were refused here). 1-100 characters since 0.1.126 (it
            allowed 255, which stored jobs no worker could claim).
        event_type:
          type: string
        payload:
          type: object
        idempotency_key:
          type: string
        priority:
          type: integer

    WebhookResponse:
      type: object
      properties:
        job_id:
          type: string
          description: >-
            ID of the created job, or of the existing job when the request
            replays an already-seen idempotency_key
        queue_name:
          type: string
          description: >-
            Queue the job is in, read back from the stored row (an idempotent
            replay reports the original job's queue, not the request's)
        status:
          type: string
          description: >-
            Job status read back from the stored row. `pending` for a newly
            enqueued job; an idempotent replay reports the existing job's
            current status (processing, completed, failed, deadletter).

    InboundWebhookDelivery:
      type: object
      description: One accepted request to the custom inbound webhook
      required: [id, provider, event_type, created_at]
      properties:
        id:
          type: string
        provider:
          type: string
          description: '`custom`'
        event_type:
          type: string
        matched_queue:
          type: [string, 'null']
          description: Queue the request was routed to
        job_id:
          type: [string, 'null']
          description: Job the request created or matched (`null` for entries before 0.1.122)
        status:
          type: [string, 'null']
          enum: [created, duplicate, null]
          description: >-
            `created` for a new job, `duplicate` when the idempotency key matched an existing
            job (`null` for entries before 0.1.122)
        created_at:
          type: string
          format: date-time

    # Bulk Operations
    BulkEnqueueRequest:
      type: object
      required: [queue_name, jobs]
      properties:
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
        jobs:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BulkJobItem'
        default_priority:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
        default_max_retries:
          type: integer
          minimum: 0
          maximum: 100
          default: 3
          description: Omitted → the queue's `max_retries`, else the server default (3)
        default_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
          description: Omitted → the queue's `default_timeout`, else the server default (300)

    BulkJobItem:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
        priority:
          type: integer
          minimum: -100
          maximum: 100
        idempotency_key:
          type: string
          maxLength: 255
          description: An empty or whitespace-only value is treated as no key
        scheduled_at:
          type: string
          format: date-time

    BulkEnqueueResponse:
      type: object
      required: [succeeded, failed, total, success_count, failure_count]
      properties:
        succeeded:
          type: array
          items:
            $ref: '#/components/schemas/BulkJobResult'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BulkJobError'
        total:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer

    BulkJobResult:
      type: object
      required: [index, job_id, created]
      properties:
        index:
          type: integer
        job_id:
          type: string
        created:
          type: boolean

    BulkJobError:
      type: object
      required: [index, error]
      properties:
        index:
          type: integer
          description: Position of the invalid item in the request's `jobs`
        error:
          type: string
          description: Why the item was refused (validation message)

    # Priority Boost
    BoostPriorityRequest:
      type: object
      required: [priority]
      properties:
        priority:
          type: integer
          minimum: -100
          maximum: 100

    BoostPriorityResponse:
      type: object
      required: [job_id, old_priority, new_priority]
      properties:
        job_id:
          type: string
        old_priority:
          type: integer
        new_priority:
          type: integer

    # Dead-Letter Queue Operations
    RetryDlqRequest:
      type: object
      properties:
        job_ids:
          type: array
          items:
            type: string
        queue_name:
          type: string
          maxLength: 100
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100

    RetryDlqResponse:
      type: object
      required: [retried_count, retried_jobs]
      properties:
        retried_count:
          type: integer
        retried_jobs:
          type: array
          items:
            type: string
        skipped_jobs:
          type: array
          description: >-
            Dead-lettered steps of failed workflows left in the DLQ because
            reviving their workflow would exceed the plan's max_workflows
            (oldest first, at most `limit`). When nothing else could be
            retried the request fails with that limit's error instead.
          items:
            type: string

    PurgeDlqRequest:
      type: object
      required: [confirm]
      properties:
        queue_name:
          type: string
          maxLength: 100
        older_than:
          type: string
          format: date-time
          description: Only jobs dead-lettered before this time (not created before it)
        confirm:
          type: boolean
          description: Must be true to execute purge

    PurgeDlqResponse:
      type: object
      required: [purged_count]
      properties:
        purged_count:
          type: integer

    # Queue Control
    PauseQueueRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional reason for pausing

    PauseQueueResponse:
      type: object
      required: [queue_name, paused, paused_at]
      properties:
        queue_name:
          type: string
        paused:
          type: boolean
        paused_at:
          type: string
          format: date-time
        reason:
          type: string

    ResumeQueueResponse:
      type: object
      required: [queue_name, resumed, paused_duration_secs]
      properties:
        queue_name:
          type: string
        resumed:
          type: boolean
        paused_duration_secs:
          type: integer

    # Workflow Models
    CreateWorkflowRequest:
      type: object
      required: [name, jobs]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowJobDefinition'
          minItems: 1
          maxItems: 100
        metadata:
          type: object

    WorkflowJobDefinition:
      type: object
      required: [key, queue_name, payload]
      properties:
        key:
          type: string
          description: Unique key for this job within the workflow
          maxLength: 100
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Letters, digits, `-`, `_` and `.`, not starting with `.` or `-`: the names
            `POST /jobs/claim` accepts. 1-100 characters, `400` otherwise (since 0.1.126; before,
            255 and any character).
        payload:
          type: object
        depends_on:
          type: array
          items:
            type: string
          description: Keys of jobs this job depends on
        dependency_mode:
          type: string
          enum: [all, any]
          default: all
        priority:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
          description: Outside -100..100 is `400`. It used to fail the jobs check as `500`.
        max_retries:
          type: integer
          minimum: 0
          maximum: 100
          description: Outside 0..100 is `400`. It used to be stored clamped.
        timeout_seconds:
          type: integer
