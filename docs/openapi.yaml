openapi: 3.1.0
info:
  title: Spooled Cloud API
  description: |
    Production-ready webhook queue service API.

    Spooled Cloud provides a reliable, multi-tenant job queue system with:
    - Custom webhook ingestion (receive events from any source)
    - Job queue with retry logic and dead-letter queue
    - Worker coordination with heartbeat and lease management
    - Real-time job status updates via WebSocket/SSE
    - Workflow orchestration with job dependencies
    - Cron-based job scheduling
    - Stripe billing integration for subscription management

    ## Authentication

    All API endpoints (except health checks) require authentication via API key.
    Include your API key in the `Authorization` header:

    ```
    Authorization: Bearer sp_live_your_api_key_here
    ```

    Every authenticated endpoint can answer `503 SERVICE_UNAVAILABLE`
    ("Authentication is temporarily unavailable", with `Retry-After: 5`) when the
    credential could not be checked: the database cannot be reached, or an API key
    created before 0.1.90 waited longer than about one bcrypt scan of such keys (at most
    10 s) while other unknown keys held the scan. It is safe to retry. Any other database failure
    during authentication answers `500 INTERNAL_ERROR` ("Authentication failed"). Database
    error text is never returned.

    ## Security

    - **Multi-tenant isolation**: All operations are scoped to your organization
    - **API key verification**: Keys verified using bcrypt with caching
    - **Webhook signatures**: HMAC-SHA256 with constant-time comparison
    - **Rate limiting**: Per-organization token bucket by plan, plus an optional per-key limit, with graceful degradation
    - **Input validation**: All inputs sanitized and size-limited
    - **SSRF protection**: Webhook URLs validated in production

    ## Rate Limiting

    Authenticated requests share one token bucket per organization, sized by plan tier:
    - Free tier: 5 requests/second (burst: 10)
    - Starter tier: 25 requests/second (burst: 50)
    - Pro tier: 100 requests/second (burst: 200)
    - Enterprise: 500 requests/second (burst: 1000)

    An API key may also carry its own `rate_limit` in requests per **minute**; it is checked together
    with the organization limit, so it can only lower what that key may do. The key's window runs
    first: a request it refuses does not use up an organization token (before 0.1.126 it did, and one
    runaway key could starve the others).

    An organization whose `custom_limits` set `rate_limit_requests_per_second` or `rate_limit_burst`
    to `0` is blocked: every authenticated request answers `429` with `Retry-After: 60`. Before
    0.1.126 a `0` was read as one request per second.

    A rejected request answers `429` with code `RATE_LIMIT_EXCEEDED`, a `Retry-After` header (seconds)
    and a JSON body with `retry_after_secs`, `limit`, `remaining` and `reset_at`.

    `429` has two meanings; tell them apart by `code`, not by the status:
    - `RATE_LIMIT_EXCEEDED`: too many requests for now. It carries `Retry-After`; waiting that long
      and retrying works. Too many open realtime streams (SSE or WebSocket) also answers
      `RATE_LIMIT_EXCEEDED`, without `Retry-After`: it clears when one of your streams closes.
    - `QUOTA_EXCEEDED`: a plan limit is full (active jobs, queues, workers, workflows, schedules,
      API keys, webhooks, ...). It carries no `Retry-After`, because waiting does not help: free
      a slot (delete or finish something) or move to a bigger plan. The body names the `resource`,
      the `current` count, the `limit` and the `plan`, plus `upgrade_to` (the next plan) when
      there is a higher one.

    Authenticated responses also carry the state of the limit that answered the request:
    `X-RateLimit-Limit` (the plan burst for the organization bucket, or the key's per-minute
    limit), `X-RateLimit-Remaining` (requests that may still be made right now),
    `X-RateLimit-Reset` (the Unix time in seconds at which `X-RateLimit-Remaining` next goes up;
    the current time for a full bucket) and `X-RateLimit-Scope` (`organization` or `api_key`).
    On a `429`, `X-RateLimit-Reset` is the current time plus `Retry-After` and equals the body's
    `reset_at`; `Retry-After` is the wait in seconds. A request that bypasses the limiter carries
    none of these headers.
    The headers are exposed to cross-origin browsers (`Access-Control-Expose-Headers`), as are
    `Retry-After`, `X-Request-Id` and `X-Has-More`.

    ## Plan Limits

    Each plan tier has resource limits:
    - Jobs per day: Free (1,000), Starter (10,000), Pro (100,000), Enterprise (unlimited)
    - Active jobs: Free (10), Starter (500), Pro (5,000), Enterprise (unlimited)
    - Queues: Free (2), Starter (10), Pro (50), Enterprise (unlimited)
    - Workers: Free (1), Starter (5), Pro (25), Enterprise (unlimited)
    - Workflows: Free (disabled), Starter (5), Pro (25), Enterprise (unlimited). Only
      workflows that are pending or running count toward the limit.

