          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDependenciesRequest'
      responses:
        '200':
          description: Dependencies added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDependenciesResponse'

  # Real-time Endpoints
  /api/v1/ws:
    get:
      tags: [Real-time]
      summary: WebSocket connection
      description: |
        Establish a WebSocket connection for real-time updates.

        ## Authentication
        **Required**: Pass your JWT token in the `token` query parameter.
        WebSocket connections cannot use headers for authentication.

        ```
        wss://api.spooled.cloud/api/v1/ws?token=eyJ...
        ```

        ## Connection
        Connect to this endpoint and upgrade to WebSocket protocol.

        ## Events
        The server will send events for:
        - Job status changes
        - Queue statistics updates
        - Worker heartbeats
        - System health updates

        ## Filtering
        Use query parameters to filter events:
        - `queue`: Filter by queue name
        - `job_id`: Filter by specific job
        - `events`: Comma-separated event types

        ## Client Commands
        Send JSON messages to subscribe/unsubscribe:
        ```json
        {"cmd": "Subscribe", "queue": "emails", "job_id": null}
        {"cmd": "Unsubscribe", "queue": "emails", "job_id": null}
        {"cmd": "Ping"}
        ```
      operationId: websocketHandler
      parameters:
        - name: token
          in: query
          required: true
          description: JWT authentication token
          schema:
            type: string
        - name: queue
          in: query
          schema:
            type: string
        - name: job_id
          in: query
          schema:
            type: string
        - name: events
          in: query
          description: Comma-separated event types
          schema:
            type: string
      responses:
        '101':
          description: Switching to WebSocket protocol

  /api/v1/events:
    get:
      tags: [Real-time]
      summary: Server-Sent Events stream
      description: Subscribe to all system events via SSE
      operationId: sseEventsHandler
      parameters:
        - name: queue
          in: query
          schema:
            type: string
        - name: events
          in: query
          description: Comma-separated event types to filter
          schema:
            type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'

  /api/v1/events/jobs/{id}:
    get:
      tags: [Real-time]
      summary: Job status SSE stream
      description: Subscribe to status updates for a specific job
      operationId: sseJobHandler
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream for job status
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'

  /api/v1/events/queues/{name}:
    get:
      tags: [Real-time]
      summary: Queue stats SSE stream
      description: Subscribe to statistics updates for a specific queue
      operationId: sseQueueHandler
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream for queue stats
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'

  # Schedule (Cron) Endpoints
  /api/v1/schedules:
    get:
      tags: [Schedules]
      summary: List schedules
      description: List all cron-based job schedules
      operationId: listSchedules
      parameters:
        - name: organization_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
    post:
      tags: [Schedules]
      summary: Create schedule
      description: Create a new cron-based recurring job schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScheduleResponse'
        '400':
          description: Invalid cron expression or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedules/{id}:
    get:
      tags: [Schedules]
      summary: Get schedule
      description: Get a schedule by ID
      operationId: getSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Schedule not found
    put:
      tags: [Schedules]
      summary: Update schedule
      description: Update an existing schedule
      operationId: updateSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Schedule not found
    delete:
      tags: [Schedules]
      summary: Delete schedule
      description: Delete a schedule
      operationId: deleteSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Schedule deleted
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/pause:
    post:
      tags: [Schedules]
      summary: Pause schedule
      description: Temporarily pause a schedule from creating jobs
      operationId: pauseSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/resume:
    post:
      tags: [Schedules]
      summary: Resume schedule
      description: Resume a paused schedule
      operationId: resumeSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/trigger:
    post:
      tags: [Schedules]
      summary: Trigger schedule
      description: Manually trigger a schedule to create a job immediately
      operationId: triggerSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule triggered, job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerScheduleResponse'
        '404':
          description: Schedule not found

  /api/v1/schedules/{id}/history:
    get:
      tags: [Schedules]
      summary: Schedule history
      description: Get the execution history of a schedule
      operationId: getScheduleHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Schedule run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleRun'
        '404':
          description: Schedule not found

  # Outgoing Webhook Endpoints
  /api/v1/outgoing-webhooks:
    get:
      tags: [Outgoing Webhooks]
      summary: List outgoing webhooks
      description: List all configured outgoing webhooks for the organization
      operationId: listOutgoingWebhooks
      responses:
        '200':
          description: List of outgoing webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutgoingWebhook'
    post:
      tags: [Outgoing Webhooks]
      summary: Create outgoing webhook
      description: |
        Create a new outgoing webhook configuration.
        The webhook will be called when any of the subscribed events occur.
      operationId: createOutgoingWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutgoingWebhookRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingWebhook'
        '400':
          description: Invalid request

  /api/v1/outgoing-webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Webhook ID
    get:
      tags: [Outgoing Webhooks]
      summary: Get outgoing webhook
      operationId: getOutgoingWebhook
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingWebhook'
        '404':
          description: Webhook not found
    put:
      tags: [Outgoing Webhooks]
      summary: Update outgoing webhook
      operationId: updateOutgoingWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutgoingWebhookRequest'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingWebhook'
        '404':
          description: Webhook not found
    delete:
      tags: [Outgoing Webhooks]
      summary: Delete outgoing webhook
      operationId: deleteOutgoingWebhook
      responses:
        '204':
          description: Webhook deleted
        '404':
          description: Webhook not found

  /api/v1/outgoing-webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Outgoing Webhooks]
      summary: Test outgoing webhook
      description: Send a test payload to the webhook URL to verify connectivity
      operationId: testOutgoingWebhook
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestWebhookResponse'
        '404':
          description: Webhook not found

  /api/v1/outgoing-webhooks/{id}/deliveries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Outgoing Webhooks]
      summary: Get webhook delivery history
      description: Get the delivery history for an outgoing webhook
      operationId: getOutgoingWebhookDeliveries
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutgoingWebhookDelivery'
        '404':
          description: Webhook not found

  /api/v1/outgoing-webhooks/{id}/retry/{delivery_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Webhook ID
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
        description: Delivery ID
    post:
      tags: [Outgoing Webhooks]
      summary: Retry webhook delivery
      description: |
        Trigger a retry for a specific outgoing webhook delivery attempt.
        
        **Limitations:**
        - Cannot retry successful deliveries (returns 400)
        - Maximum 10 manual retry attempts per delivery (returns 400 when exceeded)
      operationId: retryOutgoingWebhookDelivery
      responses:
        '200':
          description: Retry initiated
        '400':
          description: Bad request (delivery already successful or max retries exceeded)
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Webhook or delivery not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key in Bearer token format
    AdminKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Admin API key for platform administration

  schemas:
    HealthResponse:
      type: object
      required: [status, version, database, cache]
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
        database:
          type: boolean
        cache:
          type: boolean

    # Authentication Schemas
    LoginRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          description: API key to exchange for JWT tokens
          minLength: 10

    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: JWT access token (short-lived)
        refresh_token:
          type: string
          description: JWT refresh token (long-lived)
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token expiration in seconds
        refresh_expires_in:
          type: integer
          description: Refresh token expiration in seconds

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Valid refresh token

    RefreshTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: New JWT access token
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token expiration in seconds

    CurrentUserResponse:
      type: object
      required: [organization_id, api_key_id, queues, issued_at, expires_at]
      properties:
        organization_id:
          type: string
        api_key_id:
          type: string
        queues:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ValidateTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT token to validate

    ValidateTokenResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        error:
          type: string
          description: Error message if token is invalid
        claims:
          type: object
          description: Token claims if valid

    # Schedule Schemas
    Schedule:
      type: object
      required:
        [id, organization_id, name, cron_expression, timezone, queue_name, is_active, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        description:
          type: string
        cron_expression:
          type: string
          description: Cron expression: 5-field (minute hour day month weekday) or 6-field (leading seconds). 5-field defaults seconds to 0.
          example: '0 */5 * * * *'
        timezone:
          type: string
          default: UTC
        queue_name:
          type: string
        payload_template:
          type: object
        priority:
          type: integer
          default: 0
        max_retries:
          type: integer
          default: 3
        timeout_seconds:
          type: integer
          default: 300
        is_active:
          type: boolean
        last_run_at:
          type: string
          format: date-time
        next_run_at:
          type: string
          format: date-time
        run_count:
          type: integer
        tags:
          type: object
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateScheduleRequest:
      type: object
      required: [name, cron_expression, queue_name, payload_template]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        cron_expression:
          type: string
          description: Cron expression (5-field, or 6-field with leading seconds)
        timezone:
          type: string
          default: UTC
        queue_name:
          type: string
        payload_template:
          type: object
        priority:
          type: integer
          minimum: -100
          maximum: 100
        max_retries:
          type: integer
          minimum: 0
          maximum: 100
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        tags:
          type: object
        metadata:
          type: object

    CreateScheduleResponse:
      type: object
      required: [id, name, cron_expression]
      properties:
        id:
          type: string
        name:
          type: string
        cron_expression:
          type: string
        next_run_at:
          type: string
          format: date-time

    UpdateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        cron_expression:
          type: string
        timezone:
          type: string
        payload_template:
          type: object
        priority:
          type: integer
        max_retries:
          type: integer
        timeout_seconds:
          type: integer
        is_active:
          type: boolean
        tags:
          type: object
        metadata:
          type: object

    TriggerScheduleResponse:
      type: object
      required: [job_id, triggered_at]
      properties:
        job_id:
          type: string
        triggered_at:
          type: string
          format: date-time

    ScheduleRun:
      type: object
      required: [id, schedule_id, status, started_at]
      properties:
        id:
          type: string
        schedule_id:
          type: string
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        error_message:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details

    Organization:
      type: object
      required: [id, name, slug, plan_tier, settings, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
        billing_email:
          type: string
          format: email
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationSummary:
      type: object
      required: [id, name, slug, plan_tier, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
        billing_email:
          type: string
          format: email

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        billing_email:
          type: string
          format: email
        settings:
          type: object

    Job:
      type: object
      required:
        [
          id,
          organization_id,
          queue_name,
          status,
          payload,
          retry_count,
          max_retries,
          timeout_seconds,
          priority,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        queue_name:
          type: string
        status:
          type: string
          enum: [pending, scheduled, processing, completed, failed, deadletter, cancelled]
        payload:
          type: object
        result:
          type: object
        retry_count:
          type: integer
        max_retries:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        priority:
          type: integer
        tags:
          type: object
        timeout_seconds:
          type: integer
        parent_job_id:
          type: string
        completion_webhook:
          type: string
          format: uri
        assigned_worker_id:
          type: string
        lease_id:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
        updated_at:
          type: string
          format: date-time

    JobSummary:
      type: object
      required: [id, queue_name, status, priority, retry_count, created_at]
      properties:
        id:
          type: string
        queue_name:
          type: string
        status:
          type: string
        priority:
          type: integer
        retry_count:
          type: integer
        created_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    CreateJobRequest:
      type: object
      required: [queue_name, payload]
      properties:
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
        payload:
          type: object
        priority:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
        max_retries:
          type: integer
          minimum: 0
          maximum: 100
          default: 3
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
        scheduled_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        tags:
          type: object
        parent_job_id:
          type: string
        completion_webhook:
          type: string
          format: uri
        idempotency_key:
          type: string
          maxLength: 255

    CreateJobResponse:
      type: object
      required: [id, created]
      properties:
        id:
          type: string
          description: Job ID (new or existing if idempotent)
        created:
          type: boolean
          description: Whether this was a new job or existing

    JobStats:
      type: object
      required: [pending, scheduled, processing, completed, failed, deadletter, cancelled, total]
      properties:
        pending:
          type: integer
        scheduled:
          type: integer
        processing:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        deadletter:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer

    QueueConfig:
      type: object
      required:
        [
          id,
          organization_id,
          queue_name,
          max_retries,
          default_timeout,
          enabled,
          settings,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        queue_name:
          type: string
        max_retries:
          type: integer
        default_timeout:
          type: integer
        rate_limit:
          type: integer
        enabled:
          type: boolean
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QueueConfigSummary:
      type: object
      required: [queue_name, max_retries, default_timeout, enabled]
      properties:
        queue_name:
          type: string
        max_retries:
          type: integer
        default_timeout:
          type: integer
        rate_limit:
          type: integer
        enabled:
          type: boolean

    UpsertQueueConfigRequest:
      type: object
      required: [queue_name]
      properties:
        queue_name:
          type: string
        max_retries:
          type: integer
          minimum: 0
          maximum: 100
        default_timeout:
          type: integer
          minimum: 1
          maximum: 86400
        rate_limit:
          type: integer
          minimum: 1
          maximum: 100000
        enabled:
          type: boolean
        settings:
          type: object

    QueueStats:
      type: object
      required:
        [
          queue_name,
          pending_jobs,
          processing_jobs,
          completed_jobs_24h,
          failed_jobs_24h,
          active_workers,
        ]
      properties:
        queue_name:
          type: string
        pending_jobs:
          type: integer
        processing_jobs:
          type: integer
        completed_jobs_24h:
          type: integer
        failed_jobs_24h:
          type: integer
        avg_processing_time_ms:
          type: number
        max_job_age_seconds:
          type: integer
        active_workers:
          type: integer

    Worker:
      type: object
      required:
        [
          id,
          organization_id,
          queue_name,
          hostname,
          max_concurrency,
          current_jobs,
          status,
          last_heartbeat,
          metadata,
          registered_at,
        ]
      properties:
        id:
          type: string
        organization_id:
          type: string
        queue_name:
          type: string
        hostname:
          type: string
        worker_type:
          type: string
        max_concurrency:
          type: integer
        current_jobs:
          type: integer
        status:
          type: string
          enum: [healthy, degraded, offline, draining]
        last_heartbeat:
          type: string
          format: date-time
        metadata:
          type: object
        version:
          type: string
        registered_at:
          type: string
          format: date-time

    WorkerSummary:
      type: object
      required: [id, queue_name, hostname, status, current_jobs, max_concurrency, last_heartbeat]
      properties:
        id:
          type: string
        queue_name:
          type: string
        hostname:
          type: string
        status:
          type: string
        current_jobs:
          type: integer
        max_concurrency:
          type: integer
        last_heartbeat:
          type: string
          format: date-time

    RegisterWorkerRequest:
      type: object
      required: [queue_name, hostname]
      properties:
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
        hostname:
          type: string
          minLength: 1
          maxLength: 255
        worker_type:
          type: string
          maxLength: 50
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        metadata:
          type: object
        version:
          type: string
          maxLength: 50

    RegisterWorkerResponse:
      type: object
      required: [id, queue_name, lease_duration_secs, heartbeat_interval_secs]
      properties:
        id:
          type: string
        queue_name:
          type: string
        lease_duration_secs:
          type: integer
        heartbeat_interval_secs:
          type: integer

    WorkerHeartbeatRequest:
      type: object
      required: [current_jobs]
      properties:
        current_jobs:
          type: integer
        status:
          type: string
        metadata:
          type: object

    ApiKeySummary:
      type: object
      required: [id, name, queues, is_active, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        queues:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        queues:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
          minimum: 1
          maximum: 10000
        expires_at:
          type: string
          format: date-time

    CreateApiKeyResponse:
      type: object
      required: [id, key, name, created_at]
      properties:
        id:
          type: string
        key:
          type: string
          description: The raw API key (only shown once)
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    UpdateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        queues:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
          minimum: 1
          maximum: 10000
        is_active:
          type: boolean

    CustomWebhookRequest:
      type: object
      required: [queue_name, payload]
      properties:
        queue_name:
          type: string
        event_type:
          type: string
        payload:
          type: object
        idempotency_key:
          type: string
        priority:
          type: integer

    WebhookResponse:
      type: object
      properties:
        job_id:
          type: string
          description: ID of the created job
        queue_name:
          type: string
          description: Name of the queue the job was enqueued to
        status:
          type: string
          description: Job status (pending, scheduled)

    # Bulk Operations
    BulkEnqueueRequest:
      type: object
      required: [queue_name, jobs]
      properties:
        queue_name:
          type: string
          minLength: 1
          maxLength: 100
        jobs:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BulkJobItem'
        default_priority:
          type: integer
          default: 0
        default_max_retries:
          type: integer
          default: 3
        default_timeout_seconds:
          type: integer
          default: 300

    BulkJobItem:
      type: object
      required: [payload]
      properties:
        payload:
          type: object
        priority:
          type: integer
        idempotency_key:
          type: string
          maxLength: 255
        scheduled_at:
          type: string
          format: date-time

    BulkEnqueueResponse:
      type: object
      required: [succeeded, failed, total, success_count, failure_count]
      properties:
        succeeded:
          type: array
          items:
            $ref: '#/components/schemas/BulkJobResult'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BulkJobError'
        total:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer

    BulkJobResult:
      type: object
      required: [index, job_id, created]
      properties:
        index:
          type: integer
        job_id:
          type: string
        created:
          type: boolean

    BulkJobError:
      type: object
      required: [index, error]
      properties:
        index:
          type: integer
        error:
          type: string

    # Priority Boost
    BoostPriorityRequest:
      type: object
      required: [priority]
      properties:
        priority:
          type: integer
          minimum: -100
          maximum: 100

    BoostPriorityResponse:
      type: object
      required: [job_id, old_priority, new_priority]
      properties:
        job_id:
          type: string
        old_priority:
          type: integer
        new_priority:
          type: integer

    # Dead-Letter Queue Operations
    RetryDlqRequest:
      type: object
      properties:
        job_ids:
          type: array
          items:
            type: string
        queue_name:
          type: string
          maxLength: 100
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100

    RetryDlqResponse:
      type: object
      required: [retried_count, retried_jobs]
      properties:
        retried_count:
          type: integer
        retried_jobs:
          type: array
          items:
            type: string

    PurgeDlqRequest:
      type: object
      required: [confirm]
      properties:
        queue_name:
          type: string
          maxLength: 100
        older_than:
          type: string
          format: date-time
        confirm:
          type: boolean
          description: Must be true to execute purge

    PurgeDlqResponse:
      type: object
      required: [purged_count]
      properties:
        purged_count:
          type: integer

    # Queue Control
    PauseQueueRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional reason for pausing

    PauseQueueResponse:
      type: object
      required: [queue_name, paused, paused_at]
      properties:
        queue_name:
          type: string
        paused:
          type: boolean
        paused_at:
          type: string
          format: date-time
        reason:
          type: string

    ResumeQueueResponse:
      type: object
      required: [queue_name, resumed, paused_duration_secs]
      properties:
        queue_name:
          type: string
        resumed:
          type: boolean
        paused_duration_secs:
          type: integer

    # Workflow Models
    CreateWorkflowRequest:
      type: object
      required: [name, jobs]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowJobDefinition'
          minItems: 1
          maxItems: 1000
        metadata:
          type: object

    WorkflowJobDefinition:
      type: object
      required: [key, queue_name, payload]
      properties:
        key:
          type: string
          description: Unique key for this job within the workflow
          maxLength: 100
        queue_name:
          type: string
          maxLength: 255
        payload:
          type: object
        depends_on:
          type: array
          items:
            type: string
          description: Keys of jobs this job depends on
        dependency_mode:
          type: string
          enum: [all, any]
          default: all
        priority:
          type: integer
          default: 0
        max_retries:
          type: integer
        timeout_seconds:
          type: integer

    CreateWorkflowResponse:
      type: object
      required: [workflow_id, job_ids, status]
      properties:
        workflow_id:
          type: string
          format: uuid
        job_ids:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowJobMapping'
        status:
          type: string

    WorkflowJobMapping:
      type: object
      required: [key, job_id]
      properties:
        key:
          type: string
        job_id:
          type: string
          format: uuid

    WorkflowResponse:
      type: object
      required:
        [id, name, status, total_jobs, completed_jobs, failed_jobs, progress_percent, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        total_jobs:
          type: integer
        completed_jobs:
          type: integer
        failed_jobs:
          type: integer
        progress_percent:
          type: number
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        metadata:
          type: object

    AddDependenciesRequest:
      type: object
      required: [depends_on]
      properties:
        depends_on:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
        dependency_mode:
          type: string
          enum: [all, any]
          default: all

    AddDependenciesResponse:
      type: object
      required: [dependencies_added, dependencies_met]
      properties:
        dependencies_added:
          type: integer
        dependencies_met:
          type: boolean

    JobWithDependencies:
      type: object
      required: [job_id, dependencies, dependents, dependencies_met]
      properties:
        job_id:
          type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyInfo'
        dependents:
          type: array
          items:
            $ref: '#/components/schemas/DependencyInfo'
        dependencies_met:
          type: boolean

    DependencyInfo:
      type: object
      required: [job_id, queue_name, status]
      properties:
        job_id:
          type: string
        queue_name:
          type: string
        status:
          type: string

    # Dashboard Models
    DashboardData:
      type: object
      required: [system, jobs, queues, workers, recent_activity]
      properties:
        system:
          $ref: '#/components/schemas/SystemInfo'
        jobs:
          $ref: '#/components/schemas/JobSummaryStats'
        queues:
          type: array
          items:
            $ref: '#/components/schemas/QueueSummary'
        workers:
          $ref: '#/components/schemas/WorkerHealthSummary'
        recent_activity:
          $ref: '#/components/schemas/RecentActivity'

    SystemInfo:
      type: object
      required: [version, uptime_seconds, started_at, database_status, cache_status, environment]
      properties:
        version:
          type: string
        uptime_seconds:
          type: integer
        started_at:
          type: string
          format: date-time
        database_status:
          type: string
        cache_status:
          type: string
        environment:
          type: string

    JobSummaryStats:
      type: object
      required: [total, pending, processing, completed_24h, failed_24h, deadletter]
      properties:
        total:
          type: integer
        pending:
          type: integer
        processing:
          type: integer
        completed_24h:
          type: integer
        failed_24h:
          type: integer
        deadletter:
          type: integer
        avg_wait_time_ms:
          type: number
        avg_processing_time_ms:
          type: number

    QueueSummary:
      type: object
      required: [name, pending, processing, paused]
      properties:
        name:
          type: string
        pending:
          type: integer
        processing:
          type: integer
        paused:
          type: boolean

    WorkerHealthSummary:
      type: object
      required: [total, healthy, unhealthy]
      properties:
        total:
          type: integer
        healthy:
          type: integer
        unhealthy:
          type: integer

    RecentActivity:
      type: object
      required: [jobs_created_1h, jobs_completed_1h, jobs_failed_1h]
      properties:
        jobs_created_1h:
          type: integer
        jobs_completed_1h:
          type: integer
        jobs_failed_1h:
          type: integer

    # Batch Status
    BatchJobStatus:
      type: object
      required: [id, status, queue_name, retry_count, created_at]
      properties:
        id:
          type: string
        status:
          type: string
        queue_name:
          type: string
        retry_count:
          type: integer
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    # Real-time Events
    RealtimeEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum:
            # JSON payload "type" values (matches backend `RealtimeEvent` enum variants)
            - JobStatusChange
            - JobCreated
            - JobCompleted
            - JobFailed
            - QueueStats
            - WorkerHeartbeat
            - WorkerRegistered
            - WorkerDeregistered
            - SystemHealth
            - Ping
            - Error
        data:
          type: object

    # Outgoing Webhook Schemas
    OutgoingWebhook:
      type: object
      required:
        [id, organization_id, name, url, events, enabled, failure_count, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - job.created
              - job.started
              - job.completed
              - job.failed
              - job.cancelled
              - queue.paused
              - queue.resumed
              - worker.registered
              - worker.deregistered
              - schedule.triggered
        enabled:
          type: boolean
        failure_count:
          type: integer
        last_triggered_at:
          type: string
          format: date-time
        last_status:
          type: string
          enum: [success, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOutgoingWebhookRequest:
      type: object
      required: [name, url, events]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - job.created
              - job.started
              - job.completed
              - job.failed
              - job.cancelled
              - queue.paused
              - queue.resumed
              - worker.registered
              - worker.deregistered
              - schedule.triggered
        secret:
          type: string
          maxLength: 255
          description: Optional HMAC secret for signing webhook payloads
        enabled:
          type: boolean
          default: true

    UpdateOutgoingWebhookRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            type: string
        secret:
          type: string
          maxLength: 255
        enabled:
          type: boolean

    TestWebhookResponse:
      type: object
      required: [success, response_time_ms]
      properties:
        success:
          type: boolean
        status_code:
          type: integer
        response_time_ms:
          type: integer
        error:
          type: string

    OutgoingWebhookDelivery:
      type: object
      required: [id, webhook_id, event, payload, status, attempts, created_at]
      properties:
        id:
          type: string
        webhook_id:
          type: string
        event:
          type: string
        payload:
          type: object
        status:
          type: string
          enum: [pending, success, failed]
        status_code:
          type: integer
        response_body:
          type: string
        error:
          type: string
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    # Webhook Token Schema
    WebhookTokenResponse:
      type: object
      required: [webhook_url]
      properties:
        webhook_token:
          type: string
          nullable: true
          description: The webhook token (null if cleared)
          example: 'whk_abc123def456...'
        webhook_url:
          type: string
          description: The webhook URL for this organization
          example: 'https://api.spooled.cloud/api/v1/webhooks/org-id/custom'

    # Usage and Admin Schemas
    UsageInfo:
      type: object
      required: [plan, limits, usage, warnings]
      properties:
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
        limits:
          $ref: '#/components/schemas/PlanLimits'
        usage:
          $ref: '#/components/schemas/ResourceUsage'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/UsageWarning'

    PlanLimits:
      type: object
      properties:
        tier:
          type: string
        display_name:
          type: string
        max_jobs_per_day:
          type: integer
          nullable: true
        max_active_jobs:
          type: integer
          nullable: true
        max_queues:
          type: integer
          nullable: true
        max_workers:
          type: integer
          nullable: true
        max_api_keys:
          type: integer
          nullable: true
        max_schedules:
          type: integer
          nullable: true
        max_workflows:
          type: integer
          nullable: true
        max_webhooks:
          type: integer
          nullable: true
        max_payload_size_bytes:
          type: integer
        rate_limit_requests_per_second:
          type: integer
        rate_limit_burst:
          type: integer
        job_retention_days:
          type: integer
        history_retention_days:
          type: integer

    ResourceUsage:
      type: object
      properties:
        jobs_today:
          $ref: '#/components/schemas/UsageItem'
        active_jobs:
          $ref: '#/components/schemas/UsageItem'
        queues:
          $ref: '#/components/schemas/UsageItem'
        workers:
          $ref: '#/components/schemas/UsageItem'
        api_keys:
          $ref: '#/components/schemas/UsageItem'
        schedules:
          $ref: '#/components/schemas/UsageItem'
        workflows:
          $ref: '#/components/schemas/UsageItem'
        webhooks:
          $ref: '#/components/schemas/UsageItem'

    UsageItem:
      type: object
      properties:
        current:
          type: integer
        limit:
          type: integer
          nullable: true
        percentage:
          type: number
          nullable: true

    UsageWarning:
      type: object
      properties:
        resource:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [warning, critical]
        current:
          type: integer
        limit:
          type: integer

    AdminOrganizationList:
      type: object
      required: [organizations, total, limit, offset]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganizationSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    AdminOrganizationSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
        is_active:
          type: boolean
        jobs_today:
          type: integer
        active_jobs:
          type: integer
        created_at:
          type: string
          format: date-time

    AdminOrganizationDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
        billing_email:
          type: string
        is_active:
          type: boolean
        settings:
          type: object
        stripe_customer_id:
          type: string
          nullable: true
          description: Stripe customer ID linked to this organization
        stripe_subscription_id:
          type: string
          nullable: true
          description: Stripe subscription ID for billing
        stripe_subscription_status:
          type: string
          nullable: true
          description: Stripe subscription status (active, past_due, canceled, etc.)
        stripe_current_period_end:
          type: string
          format: date-time
          nullable: true
          description: Current billing period end date
        stripe_cancel_at_period_end:
          type: boolean
          nullable: true
          description: Whether subscription will cancel at period end
        usage:
          $ref: '#/components/schemas/ResourceUsage'
        resource_counts:
          type: object
          properties:
            queues:
              type: integer
            workers:
              type: integer
            api_keys:
              type: integer
            schedules:
              type: integer
            workflows:
              type: integer
            webhooks:
              type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminUpdateOrganizationRequest:
      type: object
      description: |
        Update organization settings. All fields are optional.
        
        When setting `stripe_subscription_id`, the backend will auto-reconcile with Stripe API
        to fetch the correct plan tier, subscription status, and billing period from Stripe.
      properties:
        name:
          type: string
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
        is_active:
          type: boolean
        billing_email:
          type: string
          format: email
        settings:
          type: object
        custom_limits:
          type: object
          nullable: true
          description: Custom limit overrides (null or empty object resets to plan defaults)
        stripe_customer_id:
          type: string
          nullable: true
          description: Link a Stripe customer to this organization
          example: cus_TcO2bC8PunEANY
        stripe_subscription_id:
          type: string
          nullable: true
          description: Link a Stripe subscription (triggers auto-reconciliation with Stripe)
          example: sub_1Sf9GgDtp6Ou1g6CEOL29LqS
        stripe_subscription_status:
          type: string
          nullable: true
          description: Subscription status (usually auto-filled by reconciliation)
          enum: [active, past_due, canceled, unpaid, incomplete, trialing]

    PlatformStats:
      type: object
      properties:
        total_organizations:
          type: integer
        active_organizations:
          type: integer
        total_jobs_24h:
          type: integer
        completed_jobs_24h:
          type: integer
        failed_jobs_24h:
          type: integer
        active_workers:
          type: integer
        organizations_by_plan:
          type: object
          additionalProperties:
            type: integer

    # Job Processing Schemas
    ClaimJobsRequest:
      type: object
      required: [queue_name]
      properties:
        queue_name:
          type: string
          description: Queue to claim jobs from
        worker_id:
          type: string
          description: Worker identifier (for tracking)
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: Maximum number of jobs to claim
        lease_duration_secs:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
          description: Lease duration in seconds

    ClaimJobsResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ClaimedJob'

    ClaimedJob:
      type: object
      required: [id, queue_name, status, payload, lease_expires_at]
      properties:
        id:
          type: string
        queue_name:
          type: string
        status:
          type: string
        payload:
          type: object
        priority:
          type: integer
        retry_count:
          type: integer
        max_retries:
          type: integer
        timeout_seconds:
          type: integer
        lease_expires_at:
          type: string
          format: date-time
        lease_id:
          type: string
          description: >-
            Fencing token for this lease. Echo it back in complete/fail/heartbeat
            so the operation applies only to the lease this worker actually holds.
        created_at:
          type: string
          format: date-time

    CompleteJobRequest:
      type: object
      properties:
        result:
          type: object
          description: Optional result data to store with the job
        worker_id:
          type: string
        lease_id:
          type: string
          description: >-
            Lease fencing token from the claim response. When provided, the
            completion succeeds only if it matches the job's current lease
            (409 LEASE_EXPIRED otherwise).

    FailJobRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Reason for failure
        worker_id:
          type: string
        no_retry:
          type: boolean
          default: false
          description: Skip retries and go directly to DLQ
        lease_id:
          type: string
          description: >-
            Lease fencing token from the claim response. When provided, the
            failure succeeds only if it matches the job's current lease
            (409 LEASE_EXPIRED otherwise).

    HeartbeatJobRequest:
      type: object
      properties:
        extension_secs:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
          description: Extend lease by this many seconds
        worker_id:
          type: string
        lease_id:
          type: string
          description: >-
            Lease fencing token from the claim response. When provided, the
            renewal succeeds only if it matches the job's current lease
            (409 LEASE_EXPIRED otherwise).

    # Email Authentication Schemas
    CheckEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    CheckEmailResponse:
      type: object
      required: [available, exists]
      properties:
        available:
          type: boolean
          description: Whether the email is available (no account exists)
        exists:
          type: boolean
          description: Whether an account exists with this email

    StartEmailLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    StartEmailLoginResponse:
      type: object
      required: [message, email_sent_to]
      properties:
        message:
          type: string
          description: Human-friendly status message
          example: Login code sent to your email
        email_sent_to:
          type: string
          description: Email address masked for privacy
          example: j***n@example.com

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6

    VerifyEmailResponse:
      description: |
        Email verification result. The response is one of:
        - `type: login` (existing organization) with JWT tokens
        - `type: signup` (new email) with a short-lived signup token
      oneOf:
        - $ref: '#/components/schemas/VerifyEmailLoginResponse'
        - $ref: '#/components/schemas/VerifyEmailSignupResponse'
      discriminator:
        propertyName: type
        mapping:
          login: '#/components/schemas/VerifyEmailLoginResponse'
          signup: '#/components/schemas/VerifyEmailSignupResponse'

    VerifyEmailLoginResponse:
      type: object
      required: [type, access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        type:
          type: string
          enum: [login]
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer

    VerifyEmailSignupResponse:
      type: object
      required: [type, signup_token, email, expires_in]
      properties:
        type:
          type: string
          enum: [signup]
        signup_token:
          type: string
          description: Token to complete signup (used with /api/v1/auth/signup/complete)
        email:
          type: string
          format: email
        expires_in:
          type: integer
          description: Token expiration in seconds

    SignupOrganization:
      type: object
      required: [id, name, slug, billing_email]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        billing_email:
          type: string
          format: email

    CompleteSignupRequest:
      type: object
      required: [signup_token, name, slug]
      properties:
        signup_token:
          type: string
        name:
          type: string
          minLength: 3
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 50

    CompleteSignupResponse:
      type: object
      required: [organization, api_key, access_token, refresh_token, token_type, expires_in]
      properties:
        organization:
          $ref: '#/components/schemas/SignupOrganization'
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        api_key:
          type: string
          description: Initial API key (shown only once)

    # Billing Schemas
    BillingStatus:
      type: object
      required: [plan_tier]
      properties:
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
        has_stripe_customer:
          type: boolean
        stripe_customer_id:
          type: string
        subscription_status:
          type: string
          enum: [active, canceled, past_due, trialing, incomplete]
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean

    CreatePortalRequest:
      type: object
      required: [return_url]
      properties:
        return_url:
          type: string
          format: uri

    CreatePortalResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Stripe Customer Portal URL

    # Slug Schemas
    CheckSlugResponse:
      type: object
      required: [available, valid]
      properties:
        available:
          type: boolean
        valid:
          type: boolean
        suggestion:
          type: string
          description: Suggested alternative if not available

    GenerateSlugRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    GenerateSlugResponse:
      type: object
      required: [slug]
      properties:
        slug:
          type: string

    # Admin Schemas
    AdminCreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 50
        billing_email:
          type: string
          format: email
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
          default: free
        settings:
          type: object

    AdminCreateOrganizationResponse:
      type: object
      required: [id, name, slug, plan_tier, api_key]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
        api_key:
          type: string
          description: Initial API key (shown only once)
        api_key_id:
          type: string
        created_at:
          type: string
          format: date-time

security:
  - bearerAuth: []
