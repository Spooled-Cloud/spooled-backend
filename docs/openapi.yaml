servers:
  - url: https://api.spooled.cloud
    description: Production API
  - url: https://api.staging.spooled.cloud
    description: Staging API
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: JWT authentication and token management
  - name: Organizations
    description: Organization management
  - name: Jobs
    description: Job queue operations
  - name: Queues
    description: Queue configuration and statistics
  - name: Workers
    description: Worker registration and management
  - name: API Keys
    description: API key management
  - name: Webhooks
    description: Webhook ingestion endpoints
  - name: Workflows
    description: Workflow and job dependency management
  - name: Schedules
    description: Cron-based recurring job schedules
  - name: Outgoing Webhooks
    description: Configure webhooks for receiving notifications when events occur
  - name: Real-time
    description: WebSocket and Server-Sent Events for real-time updates
  - name: Billing
    description: Subscription and billing management via Stripe
  - name: Admin
    description: Platform administration (requires X-Admin-Key header)

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: |
        Returns the health status of the service and its dependencies.

        The status code follows the database only: `200` while the database answers, `503`
        (with the same body) while it does not, so `curl -f` healthchecks fail. A
        configured Redis that does not answer, a stopped gRPC server or a stalled
        background scheduler keep the `200` and set `status` to `degraded` with the matching
        boolean `false`. The version is not part of this unauthenticated response (see
        `GET /api/v1/dashboard`).
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy, or degraded with the database still reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                database: true
                cache: true
                grpc: true
                scheduler: true
        '503':
          description: The database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                database: false
                cache: true
                grpc: true
                scheduler: true

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Kubernetes liveness probe - returns 200 if the service is running
      operationId: liveness
      security: []
      responses:
        '200':
          description: Service is alive

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Kubernetes readiness probe - returns 200 if the service can accept traffic
      operationId: readiness
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard data
      description: |
        Returns comprehensive dashboard data including system info, job statistics,
        queue summaries, worker status, and recent activity.

        Requires authentication. Data is scoped to the authenticated organization.
        `system.uptime_seconds` and `system.started_at` count from process start.

        `jobs.scheduled` counts jobs waiting out a retry backoff and is not part of
        `jobs.pending`. `workers.total` is every worker of the organization (offline ones
        included); `workers.healthy` are those with status `healthy` and a heartbeat in the last
        two minutes, and `workers.unhealthy` is the difference. `queues` lists the queues in
        `queue_config` (a paused queue with no jobs too) and the queues that have jobs, paused
        ones first, then by name, at most 20.
      operationId: dashboardData
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Returns application metrics in Prometheus text format.

        Metrics include:
        - `spooled_jobs_enqueued_total`: Total jobs enqueued
        - `spooled_jobs_completed_total`: Total jobs completed
        - `spooled_jobs_failed_total`: Total jobs failed
        - `spooled_jobs_pending`: Current pending jobs
        - `spooled_jobs_processing`: Current processing jobs
        - `spooled_job_duration_seconds`: Job processing duration histogram (REST and gRPC completions)
        - `spooled_workers_active`: Active workers
        - `spooled_api_requests_total{method,route,status}`: Total API requests by method,
          matched route template (`unmatched` for 404s) and status class (`2xx`, `4xx`, ...)
        - `spooled_api_request_duration_seconds{method,route}`: API latency histogram
        - `spooled_database_connections_active` / `spooled_database_connections_max`:
          pool connections in use and the configured pool size
      operationId: prometheusMetrics
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP spooled_jobs_enqueued_total Total jobs enqueued
                # TYPE spooled_jobs_enqueued_total counter
                spooled_jobs_enqueued_total 1234
                # HELP spooled_jobs_pending Number of pending jobs
                # TYPE spooled_jobs_pending gauge
                spooled_jobs_pending 42

  # Authentication Endpoints
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login with API key
      description: |
        Exchange an API key for JWT access and refresh tokens. The key is resolved exactly
        like an `Authorization: Bearer` API key on any other route; keys of soft-deleted
        organizations are refused (401).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            The key could not be checked (`service_unavailable`): the database cannot be
            reached, or the scan of keys created before 0.1.90 stayed busy. Retry after
            `Retry-After` seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Exchange a valid refresh token for a new access token. A refresh token whose login
        session was logged out is refused (`401`), whether or not Redis still holds the
        revocation: the session revocation is stored in Postgres (since 0.1.126).
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      description: |
        Ends the login session: the access token, the refresh token minted with it,
        and every access token refreshed from that refresh token stop working (they
        share a session id). Sending `refresh_token` in the body is optional; tokens
        issued before 0.1.114 carry no session id, so for those only the access
        token (and a refresh token passed in the body) are revoked.

        Since 0.1.126 the session revocation is stored in Postgres first and Redis only
        caches it, so a Redis eviction, restart or outage does not bring a logged-out session
        back, and does not log live sessions out. A logout whose revocation could not be
        stored answers `503` and must be repeated.
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Not authenticated
        '503':
          description: The revocation could not be stored; the session is still valid, retry

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user info
      description: |
        Returns the organization and the key behind the access token. The token gets the checks
        of every authenticated route (since 0.1.126): an access token (not a refresh token), its
        session not logged out, the key active and not expired, the organization not deleted;
        otherwise `401`. `queues` is the key's current queue scope, not the list the token was
        issued with. A database failure while checking is `503`, not `401`.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Not authenticated
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  /api/v1/auth/validate:
    post:
      tags: [Authentication]
      summary: Validate a token
      description: |
        Check whether a JWT would be accepted by the API. Since 0.1.126 the rule is the API
        middleware's: `valid` is `true` only for an access token (a refresh token is
        `valid: false`) whose session was not logged out, whose key is active and not expired,
        and whose organization is not deleted; `error` says why it is not. An unreadable or
        forged token is `valid: false` too. When the check cannot run (database unavailable)
        the answer is `503`, not `valid: false`, so a caller does not sign its user out on a
        database blip.
      operationId: validateToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
      responses:
        '200':
          description: Token validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  # Email-based Authentication
  /api/v1/auth/check-email:
    get:
      tags: [Authentication]
      summary: Check email availability
      description: Check if an email is already registered
      operationId: checkEmail
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: Email address to check
      responses:
        '200':
          description: Email check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckEmailResponse'

  /api/v1/auth/email/start:
    post:
      tags: [Authentication]
      summary: Start email login
      description: |
        Start the email-based login flow. Sends a verification code to the provided email.
        If the email is not associated with an existing organization, verification will
        return a short-lived signup token to complete registration.

        Each client IP may request 3 codes per minute and 10 per hour (an IPv6 client counts
        as its whole /64), and each address receives at most 5 codes per hour. When the server
        has `TURNSTILE_SECRET_KEY` set, the request must also carry a valid `turnstile_token`
        (Cloudflare Turnstile); without that variable the field is ignored. A code is stored
        only after the mail was sent, so a mail provider failure (500) does not use up the
        address's hourly allowance.
      operationId: startEmailLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEmailLoginRequest'
      responses:
        '200':
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartEmailLoginResponse'
        '400':
          description: >-
            Validation failed, or `CAPTCHA_FAILED`: the server requires a Turnstile token and
            it is missing, rejected or could not be verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: CAPTCHA_FAILED
                message: Complete the verification challenge and try again.
        '429':
          description: >-
            Too many requests. Per client IP (3 per minute, 10 per hour) the answer is
            `RATE_LIMIT_EXCEEDED` with a `Retry-After` header and
            `details.retry_after_seconds` (also while Redis is down and the server runs with
            `RATE_LIMIT_FAIL_CLOSED`). More than 5 codes for one address in an hour is a 429
            without `Retry-After`.
          headers:
            Retry-After:
              description: Seconds until the limit clears
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
                message: Too many login codes requested from this network. Please try again in 1 minute.
                details:
                  retry_after_seconds: 60
        '500':
          description: The mail provider failed; no code was stored

  /api/v1/auth/email/verify:
    post:
      tags: [Authentication]
      summary: Verify email code
      description: Verify the code sent to the user's email and complete login
      operationId: verifyEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          description: Invalid or expired code
        '401':
          description: >-
            `AUTHENTICATION_FAILED`: the code is wrong, expired or already used, or has
            reached its own attempt limit
        '404':
          description: No pending verification found
        '429':
          description: >-
            Too many attempts: `RATE_LIMIT_EXCEEDED` with a `Retry-After` header and
            `details.retry_after_seconds`. Budgets are per address and client IP (5 guesses per
            10 minutes) and per address from all clients (20 per 10 minutes). Throttling
            never invalidates the owner's code; it only makes callers wait for the window to
            end. Before 0.1.120 this was a 401.
          headers:
            Retry-After:
              description: Seconds until the limit clears
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RATE_LIMIT_EXCEEDED
                message: Too many attempts. Please try again in 7 minutes.
                details:
                  retry_after_seconds: 420

  /api/v1/auth/signup/complete:
    post:
      tags: [Authentication]
      summary: Complete signup
      description: |
        Complete the signup process by creating an organization.
        When `REGISTRATION_MODE=closed`, the request must include `X-Admin-Key`
        matching `ADMIN_API_KEY` (same rule as `POST /organizations`).
        `EMAIL_SIGNUP_ENABLED=false` rejects the email flow entirely.
      operationId: completeSignup
      security: []
      parameters:
        - name: X-Admin-Key
          in: header
          required: false
          schema:
            type: string
          description: Required when REGISTRATION_MODE=closed; must match ADMIN_API_KEY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignupRequest'
      responses:
        '201':
          description: Signup completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSignupResponse'
        '400':
          description: Invalid organization name or slug, including a reserved slug (`admin`, `api`, `dashboard`, ...); the signup token stays valid
        '401':
          description: >-
            `AUTHENTICATION_FAILED`: the signup token is invalid, expired or already used;
            verify the email again to get a new one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email signup disabled, or closed-mode request missing a valid X-Admin-Key
        '409':
          description: >-
            `CONFLICT`: a verified organization already uses this email, or the slug is
            already taken. Neither check uses up the signup token, so a taken slug can be
            retried with another one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Billing Endpoints
  /api/v1/billing/status:
    get:
      tags: [Billing]
      summary: Get billing status
      description: |
        Get the current billing status for the organization. Needs an unrestricted API key
        (or a JWT issued from one); queue-scoped keys are refused.
      operationId: getBillingStatus
      responses:
        '200':
          description: Billing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'
        '403':
          description: The API key is restricted to queues (`ACCESS_DENIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      summary: Start a Stripe checkout
      description: |
        Create a Stripe Checkout Session that buys a plan for the authenticated organization,
        and return its URL for the caller to redirect to. Needs an unrestricted API key (or a
        JWT issued from one).

        The session is bound to the organization through metadata only this server sets,
        which is what makes a completed checkout trustworthy; the organization's existing
        Stripe customer is reused, otherwise Checkout is prefilled with its verified billing
        email. After paying or cancelling, Stripe returns the customer to
        `<FRONTEND_URL>/account/billing?checkout=success` or `?checkout=cancel`
        (`FRONTEND_URL` defaults to `https://spooled.cloud`).

        Replaces the public Stripe Payment Links, whose `client_reference_id` URL parameter
        anyone can edit. A legacy Payment Link checkout is still accepted by the webhook, but
        it links only an organization with no live subscription whose verified billing email
        the payer used, and it never cancels a subscription.
      operationId: createBillingCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutResponse'
        '400':
          description: '`VALIDATION_ERROR`: `plan` is missing or not `starter` / `pro`, or the body is not JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The API key is restricted to queues (`ACCESS_DENIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            `CONFLICT`: the organization already has that plan with an active or trialing
            subscription (manage it through the billing portal), or it is on a paid plan
            (`starter`, `pro` or `enterprise`) that an operator set and has no Stripe
            subscription: contact support to change plans. Checked before any Stripe call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            `SERVICE_UNAVAILABLE`: Stripe or that plan's price id is not configured, or the
            Stripe call failed or timed out (10 s). Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/billing/portal:
    post:
      tags: [Billing]
      summary: Create portal session
      description: Create a Stripe Customer Portal session for managing subscriptions
      operationId: createBillingPortal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortalRequest'
      responses:
        '200':
          description: Portal session URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePortalResponse'

  /api/v1/billing/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook
      description: |
        Webhook endpoint for Stripe events. Secured with STRIPE_BILLING_WEBHOOK_SECRET.
        Handles subscription lifecycle events; the Stripe endpoint must be subscribed to:

        - `checkout.session.completed`
        - `checkout.session.async_payment_succeeded` (links the organization once a delayed
          payment such as SEPA or ACH succeeds)
        - `checkout.session.async_payment_failed` (logged, links nothing)
        - `customer.subscription.created`, `customer.subscription.updated`,
          `customer.subscription.deleted`
        - `invoice.paid`, `invoice.payment_failed`

        A completed checkout is trusted only when it carries the organization in its metadata
        (created by `POST /billing/checkout`). Any other checkout (a legacy Payment Link) links
        only an organization with no live subscription whose verified billing email the payer
        used, and never cancels a subscription.
      operationId: stripeWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid webhook signature
        '409':
          description: >-
            Retry later: the event arrived before its Stripe customer is linked to an
            organization (younger than 24 h), or another attempt holds the event. Stripe retries.
        '500':
          description: >-
            Processing failed (for example the cancel of a replaced subscription); the claim is
            released and Stripe retries the event

  /api/v1/organizations/check-slug:
    get:
      tags: [Organizations]
      summary: Check slug availability
      description: |
        Check if an organization slug is available. The slug is lower-cased and trimmed, then must
        be 3-50 characters (the length website signup and `POST /organizations` accept; before
        0.1.124 this check took 1-100) of lowercase letters, digits and hyphens, not at either
        end; otherwise `valid` is false and `error` says why
        (`Validation failed: Slug must be 3-50 characters`).
        A reserved or taken slug is `valid` but not `available`, with a `suggestion` that is
        itself at most 50 characters.
      operationId: checkSlug
      security: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: Slug to check
      responses:
        '200':
          description: Slug availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckSlugResponse'

  /api/v1/organizations/generate-slug:
    post:
      tags: [Organizations]
      summary: Generate unique slug
      description: |
        Generate a unique slug from an organization name (1-200 characters). The slug is the
        name's ASCII letters and digits, lower-cased, with every other run of characters one
        hyphen, `org-` in front of a leading digit, at most 50 characters. When that base is
        taken, is a reserved name (`admin`, `api`, ...) or is shorter than 3 characters, a
        hyphen and six random hex characters are added (`admin-1f2e3d`); a name with no ASCII
        letter or digit gives `org-` and the suffix. The result is a slug `check-slug`, website
        signup and `POST /organizations` accept.
      operationId: generateSlug
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSlugRequest'
      responses:
        '200':
          description: Generated slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSlugResponse'

  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: List organizations
