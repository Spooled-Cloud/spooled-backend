    patch:
      tags: [Admin]
      summary: Update organization
      description: |
        Update organization settings including plan tier. `custom_limits` is validated: unknown
        keys, non-integer values and negative or out-of-range values are refused with
        `400 VALIDATION_ERROR` (every problem is listed in the message).
      operationId: adminUpdateOrganization
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateOrganizationRequest'
