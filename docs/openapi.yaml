          `deleted`) and, in one transaction, revokes its API keys, pauses all its schedules,
          disables its outgoing webhooks and removes its incoming-webhook token. Restoring
          `plan_tier` does not turn any of these back on.
        - **Hard delete** (`hard_delete=true`): Permanently removes organization and all related data (jobs, workflows, workers, etc.).
      operationId: adminDeleteOrganization
      security:
        - AdminKeyAuth: []
      parameters:
        - name: hard_delete
          in: query
          schema:
            type: boolean
            default: false
          description: Permanent deletion (cannot be undone)
      responses:
