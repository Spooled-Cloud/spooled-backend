    # Job Processing Schemas
    ClaimJobsRequest:
      type: object
      required: [queue_name, worker_id]
      properties:
        queue_name:
          type: string
          description: Queue to claim jobs from
        worker_id:
          type: string
          description: Worker identifier (for tracking)
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: Maximum number of jobs to claim
        lease_duration_secs:
          type: integer
          minimum: 5
          maximum: 3600
          default: 30
          description: Lease duration in seconds. Omitted → `WORKER_LEASE_DURATION_SECS` (30). gRPC has its own default for an omitted lease, `GRPC_DEFAULT_LEASE_DURATION_SECS` (300).

    ClaimJobsResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ClaimedJob'

    ClaimedJob:
      type: object
      required: [id, queue_name, payload, retry_count, max_retries, timeout_seconds, lease_expires_at, lease_id]
      properties:
        id:
          type: string
        queue_name:
          type: string
        payload:
          type: object
        retry_count:
          type: integer
        max_retries:
          type: integer
        timeout_seconds:
          type: integer
        lease_expires_at:
          type: string
          format: date-time
        lease_id:
          type: string
          description: >-
            Fencing token for this lease. Echo it back in complete/fail/heartbeat
            so the operation applies only to the lease this worker actually holds.

    CompleteJobRequest:
      type: object
      required: [worker_id, lease_id]
      properties:
        result:
          type: object
          description: Optional result data to store with the job
        worker_id:
          type: string
        lease_id:
          type: string
          description: >-
            Required lease fencing token from the claim response. Completion
            succeeds only if it matches the job's current lease (409
            LEASE_EXPIRED otherwise). A missing value is a 422 VALIDATION_ERROR.

    FailJobRequest:
      type: object
      required: [worker_id, lease_id, error]
      properties:
        error:
          type: string
          description: >-
            Error message for the failed attempt. Any text is accepted: empty
            is stored as "Job failed" and text over 4096 bytes is truncated.
        worker_id:
          type: string
        lease_id:
          type: string
          description: >-
            Required lease fencing token from the claim response. Failure
            succeeds only if it matches the job's current lease (409
            LEASE_EXPIRED otherwise). A missing value is a 422 VALIDATION_ERROR.

    HeartbeatJobRequest:
      type: object
      required: [worker_id, lease_id]
      properties:
        lease_duration_secs:
          type: integer
          minimum: 5
          maximum: 3600
          description: >-
            New lease duration from now, in seconds. Omitted → the length the lease was granted
            with (the claim's `lease_duration_secs`, or the last heartbeat that named one), else
            `WORKER_LEASE_DURATION_SECS` (30). An explicit value becomes the length later
            heartbeats keep.
        worker_id:
          type: string
        lease_id:
          type: string
          description: >-
            Required lease fencing token from the claim response. Renewal
            succeeds only if it matches the job's current lease (409
            LEASE_EXPIRED otherwise). A missing value is a 422 VALIDATION_ERROR.

    # Email Authentication Schemas
    CheckEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    CheckEmailResponse:
      type: object
      required: [available, exists, signup_enabled]
      properties:
        available:
          type: boolean
          description: Whether the email is available (no account exists)
        exists:
          type: boolean
          description: Whether an account exists with this email
        signup_enabled:
          type: boolean
          description: >-
            Whether EMAIL_SIGNUP_ENABLED is on. The marketing signup page uses this
            to stop the form before sending a verification code.

    StartEmailLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        turnstile_token:
          type: string
          maxLength: 2048
          description: >-
            Cloudflare Turnstile token. Required (and verified) only when the server has
            `TURNSTILE_SECRET_KEY` set; otherwise ignored. A missing, rejected or unverifiable
            token is `400 CAPTCHA_FAILED`.

    StartEmailLoginResponse:
      type: object
      required: [message, email_sent_to]
      properties:
        message:
          type: string
          description: Human-friendly status message
          example: Login code sent to your email
        email_sent_to:
          type: string
          description: Email address masked for privacy
          example: j***n@example.com

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6

    VerifyEmailResponse:
      description: |
        Email verification result. The response is one of:
        - `type: login` (existing organization) with JWT tokens
        - `type: signup` (new email) with a short-lived signup token
      oneOf:
        - $ref: '#/components/schemas/VerifyEmailLoginResponse'
        - $ref: '#/components/schemas/VerifyEmailSignupResponse'
      discriminator:
        propertyName: type
        mapping:
          login: '#/components/schemas/VerifyEmailLoginResponse'
          signup: '#/components/schemas/VerifyEmailSignupResponse'

    VerifyEmailLoginResponse:
      type: object
      required: [type, access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        type:
          type: string
          enum: [login]
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer

    VerifyEmailSignupResponse:
      type: object
      required: [type, signup_token, email, expires_in]
      properties:
        type:
          type: string
          enum: [signup]
        signup_token:
          type: string
          description: Token to complete signup (used with /api/v1/auth/signup/complete)
        email:
          type: string
          format: email
        expires_in:
          type: integer
          description: Token expiration in seconds
        unverified_org_exists:
          type: boolean
          description: |
            An organization already uses this address as an unconfirmed billing
            email. Its owner should sign in with an API key and confirm the
            address (POST /api/v1/organizations/billing-email/verification)
            rather than create a second organization. A hint only.

    SignupOrganization:
      type: object
      required: [id, name, slug, billing_email]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        billing_email:
          type: string
          format: email

    CompleteSignupRequest:
      type: object
      required: [signup_token, name, slug]
      properties:
        signup_token:
          type: string
        name:
          type: string
          minLength: 3
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 50
          description: |
            Lowercase letters, digits and hyphens, not starting or ending with a hyphen. It is
            trimmed and lower-cased first. The slugs `POST /organizations` reserves (`admin`,
            `api`, `dashboard`, ...) answer `400`, and the signup token can be used again.

    CompleteSignupResponse:
      type: object
      required: [organization, api_key, access_token, refresh_token, token_type, expires_in]
      properties:
        organization:
          $ref: '#/components/schemas/SignupOrganization'
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        api_key:
          type: string
          description: Initial API key (shown only once)

    # Billing Schemas
    BillingStatus:
      type: object
      required: [plan_tier]
      properties:
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
        has_stripe_customer:
          type: boolean
        stripe_customer_id:
          type: string
        subscription_status:
          type: string
          enum: [active, canceled, past_due, trialing, incomplete]
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean

    CreateCheckoutRequest:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [starter, pro]
          description: The plan to buy

    CreateCheckoutResponse:
      type: object
      required: [url, session_id]
      properties:
        url:
          type: string
          format: uri
          description: Stripe-hosted Checkout page (`https://checkout.stripe.com/...`) to redirect the user to
        session_id:
          type: string
          description: Checkout Session id (`cs_...`)

    CreatePortalRequest:
      type: object
      required: [return_url]
      properties:
        return_url:
          type: string
          format: uri

    CreatePortalResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Stripe Customer Portal URL

    # Slug Schemas
    CheckSlugResponse:
      type: object
      required: [available, valid]
      properties:
        available:
          type: boolean
        valid:
          type: boolean
        error:
          type: string
          description: >-
            Why the slug is not valid (for example
            `Validation failed: Slug must be 3-50 characters`), or
            `This slug is reserved`; absent otherwise
        suggestion:
          type: string
          description: Suggested alternative if not available (at most 50 characters)

    GenerateSlugRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    GenerateSlugResponse:
      type: object
      required: [slug]
      properties:
        slug:
          type: string

    # Admin Schemas
    AdminCreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 50
        billing_email:
          type: string
          format: email
        plan_tier:
          type: string
          enum: [free, starter, pro, enterprise]
          default: free
        settings:
          type: object

    AdminCreateOrganizationResponse:
      type: object
      required: [id, name, slug, plan_tier, api_key]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan_tier:
          type: string
        api_key:
          type: string
          description: Initial API key (shown only once)
        api_key_id:
          type: string
        created_at:
          type: string
          format: date-time

security:
  - bearerAuth: []
